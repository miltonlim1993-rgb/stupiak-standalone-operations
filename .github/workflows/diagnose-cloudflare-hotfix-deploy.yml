name: Traceable Cloudflare hotfix deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-cloudflare-hotfix-deploy.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
  CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}

jobs:
  deploy-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and deploy with captured result
        shell: bash
        run: |
          set +e
          npm ci > /tmp/install.log 2>&1
          install_status=$?
          deploy_status=99
          if [ "$install_status" -eq 0 ]; then
            npm run cf:deploy > /tmp/deploy.log 2>&1
            deploy_status=$?
          else
            echo "Deploy skipped because npm ci failed" > /tmp/deploy.log
          fi
          set -e

          mkdir -p .deployments
          {
            echo "production_deployed=$([ "$deploy_status" -eq 0 ] && echo true || echo false)"
            echo "source_commit=${GITHUB_SHA}"
            echo "install_status=${install_status}"
            echo "deploy_status=${deploy_status}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- install tail ---"
            tail -n 30 /tmp/install.log
            echo "--- deploy tail ---"
            tail -n 80 /tmp/deploy.log
          } > .deployments/data-pack-refresh-deploy-result.txt

          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/diagnose-cloudflare-hotfix-deploy.yml
          git rm -f .github/workflows/deploy-data-pack-refresh-hotfix.yml || true
          git add .deployments/data-pack-refresh-deploy-result.txt
          git commit -m "Record traceable Cloudflare hotfix deployment result"
          git push origin HEAD:main
