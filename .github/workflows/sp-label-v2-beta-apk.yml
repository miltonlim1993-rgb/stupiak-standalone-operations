name: SP Label Printing V2 Beta APK

on:
  push:
    branches:
      - feature/sp-label-printing-v2-mobile-from-labels
    paths:
      - 'mobile-label-v2/**'
      - '.github/workflows/sp-label-v2-beta-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2-beta:
    name: Build isolated V2 debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-label-v2

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install V2 dependencies only
        run: npm install --legacy-peer-deps

      - name: Typecheck V2
        run: npm run typecheck

      - name: Test V2 domain invariants
        run: npm test

      - name: Generate isolated Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload V2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp-label-printing-v2-beta-apk
          path: mobile-label-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
