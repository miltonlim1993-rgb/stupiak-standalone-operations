name: Deploy Task realtime fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-task-realtime-fix-once.yml
      - .ops-deploy-trigger/task-realtime-20260807.txt

permissions:
  contents: write

env:
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
  CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
  CLOUDFLARE_OPS_DB_ID: 080c13d7-e2f5-4c01-a1ca-aa00094d6fc0
  CLOUDFLARE_SHEET_SYNC_QUEUE_NAME: stupiaks-ops-sheet-sync
  CLOUDFLARE_SHEET_SYNC_DLQ_NAME: stupiaks-ops-sheet-sync-dlq
  CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
  STATUS_PATH: .ops-deploy-status/task-realtime-direct-20260807.json

jobs:
  deploy-task-realtime-fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve explicit Cloudflare credential aliases
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.WRANGLER_API_TOKEN }}
          TOKEN_4: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          TOKEN_5: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          TOKEN_6: ${{ secrets.CLOUDFLARE_TOKEN }}
          TOKEN_7: ${{ secrets.CF_TOKEN }}
          TOKEN_8: ${{ secrets.WORKERS_API_TOKEN }}
          TOKEN_9: ${{ secrets.WORKER_API_TOKEN }}
          API_KEY_1: ${{ secrets.CLOUDFLARE_API_KEY }}
          API_KEY_2: ${{ secrets.CF_API_KEY }}
          API_KEY_3: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
          EMAIL_2: ${{ secrets.CF_EMAIL }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          token=""
          for name in TOKEN_1 TOKEN_2 TOKEN_3 TOKEN_4 TOKEN_5 TOKEN_6 TOKEN_7 TOKEN_8 TOKEN_9; do
            if [[ -n "${!name:-}" ]]; then token="${!name}"; break; fi
          done
          account=""
          for name in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            if [[ -n "${!name:-}" ]]; then account="${!name}"; break; fi
          done
          api_key=""
          for name in API_KEY_1 API_KEY_2 API_KEY_3; do
            if [[ -n "${!name:-}" ]]; then api_key="${!name}"; break; fi
          done
          email=""
          for name in EMAIL_1 EMAIL_2; do
            if [[ -n "${!name:-}" ]]; then email="${!name}"; break; fi
          done

          if [[ -n "$token" ]]; then
            {
              echo 'CLOUDFLARE_API_TOKEN<<OPS_TOKEN'
              echo "$token"
              echo 'OPS_TOKEN'
            } >> "$GITHUB_ENV"
            echo 'CLOUDFLARE_AUTH_MODE=api-token'
          elif [[ -n "$api_key" && -n "$email" ]]; then
            {
              echo 'CLOUDFLARE_API_KEY<<OPS_KEY'
              echo "$api_key"
              echo 'OPS_KEY'
              echo 'CLOUDFLARE_EMAIL<<OPS_EMAIL'
              echo "$email"
              echo 'OPS_EMAIL'
            } >> "$GITHUB_ENV"
            echo 'CLOUDFLARE_AUTH_MODE=global-api-key'
          else
            echo 'No usable Cloudflare token or API-key/email pair is visible in the production environment' >&2
            exit 2
          fi

          if [[ -z "$account" ]]; then
            echo 'No Cloudflare account ID is visible in the production environment' >&2
            exit 3
          fi
          {
            echo 'CLOUDFLARE_ACCOUNT_ID<<OPS_ACCOUNT'
            echo "$account"
            echo 'OPS_ACCOUNT'
          } >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and architecture
        run: npm run ops:audit:contract

      - name: Build Web/PWA and validate Worker
        run: npm run build

      - name: Validate Label runtime contract
        run: node --test worker/test/label-final-runtime-v1.test.mjs

      - name: Render canonical production bindings
        run: npm run cf:render

      - name: Deploy Worker and Web/PWA assets
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - name: Verify Task realtime fix on production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)"
            index="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/?task_fix=${stamp}" || true)"
            health="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/api/health?task_fix=${stamp}" || true)"
            asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' <<<"${index}" | head -n 1 | cut -d'\"' -f2 || true)"
            bundle=""
            if [[ -n "${asset}" ]]; then
              bundle="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}${asset}?task_fix=${stamp}" || true)"
            fi
            if [[ -n "${health}" ]] && grep -Fq 'chefops-task-realtime' <<<"${bundle}"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              echo "PRODUCTION_TASK_REALTIME_FIX_VERIFIED=true"
              exit 0
            fi
            sleep 5
          done
          echo "verified=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Persist deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'console.log(JSON.stringify({job_status:process.env.JOB_STATUS,verified:process.env.VERIFIED==="true",run_id:process.env.GITHUB_RUN_ID,run_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,head_sha:process.env.GITHUB_SHA}))')"
          encoded="$(printf '%s' "$payload" | base64 -w0)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" --jq .sha 2>/dev/null || true)"
          if [[ -n "$current_sha" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: update direct Task production deploy result' -f content="$encoded" -f sha="$current_sha"
          else
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record direct Task production deploy result' -f content="$encoded"
          fi
