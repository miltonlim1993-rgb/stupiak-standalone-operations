name: Check Cloudflare deploy secrets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-cloudflare-deploy-secrets.yml

permissions:
  contents: write

jobs:
  check-and-record:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_KV: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
      CF_MEDIA: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record secret availability
        run: |
          mkdir -p .deployments
          {
            echo "cloudflare_api_token=$([ -n \"$CF_TOKEN\" ] && echo present || echo missing)"
            echo "cloudflare_account_id=$([ -n \"$CF_ACCOUNT\" ] && echo present || echo missing)"
            echo "cloudflare_app_data_packs_id=$([ -n \"$CF_KV\" ] && echo present || echo missing)"
            echo "cloudflare_media_bucket_name=$([ -n \"$CF_MEDIA\" ] && echo present || echo optional_missing)"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployments/cloudflare-secret-check.txt
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/check-cloudflare-deploy-secrets.yml
          git add .deployments/cloudflare-secret-check.txt
          git commit -m "Record Cloudflare deployment secret availability"
          git push origin HEAD:main
