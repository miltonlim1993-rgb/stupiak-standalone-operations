name: Verify Stock Count PWA v39

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-stock-count-pwa-v39.yml
  pull_request:
    paths:
      - .github/workflows/verify-stock-count-pwa-v39.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
      EXPECTED_PWA_VERSION: stock-count-layout-pwa-v39
    steps:
      - name: Wait for live PWA v39
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            stamp="$(date +%s)"
            release="$(curl -fsSL --connect-timeout 10 --max-time 20 "${OPS_PRODUCTION_ORIGIN}/app-release.json?attempt=${attempt}&ts=${stamp}" || true)"
            shell="$(curl -fsSL --connect-timeout 10 --max-time 20 "${OPS_PRODUCTION_ORIGIN}/sw-v38.js?attempt=${attempt}&ts=${stamp}" || true)"
            if grep -Fq "${EXPECTED_PWA_VERSION}" <<<"${release}" \
              && grep -Fq "${EXPECTED_PWA_VERSION}" <<<"${shell}"; then
              echo "PRODUCTION_DEPLOYMENT_VERIFIED=true"
              echo "LIVE_PWA_VERSION=${EXPECTED_PWA_VERSION}"
              echo "VERIFIED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              exit 0
            fi
            echo "Attempt ${attempt}/36: live PWA v39 not visible yet"
            sleep 10
          done
          echo "PRODUCTION_DEPLOYMENT_VERIFIED=false" >&2
          echo "Live origin did not expose ${EXPECTED_PWA_VERSION} within 6 minutes" >&2
          exit 1
