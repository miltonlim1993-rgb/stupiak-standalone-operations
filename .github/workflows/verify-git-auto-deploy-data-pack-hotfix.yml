name: Verify Cloudflare Git auto-deploy data pack hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-git-auto-deploy-data-pack-hotfix.yml

permissions:
  contents: write

jobs:
  mark-push-poll-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add production health marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/src/index.js')
          text = path.read_text()
          marker = "data_pack_refresh_policy: 'stale-aware-v1'"
          if marker not in text:
              old = """        ok: true,
                  service: 'chefops-api',
                  storage: {
          """
              new = """        ok: true,
                  service: 'chefops-api',
                  deployment: {
                    data_pack_refresh_policy: 'stale-aware-v1',
                    pack_max_age_ms: 120000,
                  },
                  storage: {
          """
              if old not in text:
                  raise SystemExit('Health block not found')
              path.write_text(text.replace(old, new, 1))
          PY
          node --check worker/src/index.js
      - name: Push marker source commit
        run: |
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git add worker/src/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Expose data pack refresh production marker"
            git push origin HEAD:main
          fi
      - name: Poll production Worker
        shell: bash
        run: |
          set +e
          success=false
          response=''
          for attempt in $(seq 1 30); do
            response=$(curl -fsS --max-time 20 'https://stupiaks-ops.sporkburger19.workers.dev/api/health' 2>/tmp/curl-error.log)
            if echo "$response" | grep -q 'stale-aware-v1'; then
              success=true
              break
            fi
            sleep 10
          done
          set -e
          mkdir -p .deployments
          {
            echo "production_deployed=${success}"
            echo "policy=stale-aware-v1"
            echo "pack_max_age_ms=120000"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "health_response=${response}"
            if [[ -s /tmp/curl-error.log ]]; then
              echo "curl_error=$(tr '\n' ' ' < /tmp/curl-error.log)"
            fi
          } > .deployments/data-pack-refresh-production-verification.txt
      - name: Record result and remove verifier
        run: |
          git rm -f .github/workflows/verify-git-auto-deploy-data-pack-hotfix.yml
          git add .deployments/data-pack-refresh-production-verification.txt
          git commit -m "Record production data pack refresh verification"
          git push origin HEAD:main
