name: Deploy stale-aware OPS Worker now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-stale-aware-production-now.yml

permissions:
  contents: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
      CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect production-environment credentials
        id: auth
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_APP_DATA_PACKS_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.auth.outputs.available == 'true'
        run: npm ci

      - name: Build and render production config
        if: steps.auth.outputs.available == 'true'
        run: |
          npm run build
          npm run cf:render

      - name: Deploy canonical OPS Worker
        id: deploy
        if: steps.auth.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx wrangler deploy --config worker/wrangler.production.jsonc >/tmp/wrangler-deploy.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ $status -ne 0 ]]; then
            tail -80 /tmp/wrangler-deploy.log
          fi
          exit 0

      - name: Verify canonical production
        id: verify
        if: steps.auth.outputs.available == 'true' && steps.deploy.outputs.status == '0'
        shell: bash
        run: |
          success=false
          response=''
          for attempt in $(seq 1 30); do
            response=$(curl -fsS --max-time 20 "$OPS_PRODUCTION_ORIGIN/api/health" || true)
            if grep -q 'stale-aware-v1' <<<"$response" && grep -q '120000' <<<"$response"; then
              success=true
              break
            fi
            sleep 10
          done
          echo "success=$success" >> "$GITHUB_OUTPUT"
          printf '%s' "$response" >/tmp/ops-health-response.txt

      - name: Record result and remove one-time workflow
        shell: bash
        run: |
          mkdir -p .deployments
          auth='${{ steps.auth.outputs.available }}'
          deploy_status='${{ steps.deploy.outputs.status }}'
          verify='${{ steps.verify.outputs.success }}'
          {
            echo "canonical_origin=$OPS_PRODUCTION_ORIGIN"
            echo "production_environment_credentials_available=${auth:-false}"
            echo "wrangler_deploy_status=${deploy_status:-not_run}"
            echo "stale_aware_verified=${verify:-false}"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ -s /tmp/ops-health-response.txt ]]; then
              echo "health_response=$(cat /tmp/ops-health-response.txt)"
            fi
          } > .deployments/stale-aware-production-deploy-result.txt

          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/deploy-stale-aware-production-now.yml
          git add .deployments/stale-aware-production-deploy-result.txt
          git commit -m "Record stale-aware production deployment result"
          git push origin HEAD:main
