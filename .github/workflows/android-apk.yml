name: Build and publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_V10_FILE_NAME: stupiaks-ops-direct-print-flow-v10.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.6.11-master-task-refresh-bilingual.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Validate Master Sheet task refresh, content orientation, bilingual tasks, printer hardware and native TSPL source
        run: |
          grep -q "chefops-v4-6-11-master-task-refresh-bilingual-native-tspl-shell-v10" web/public/sw.js
          grep -q "4.6.11-master-task-refresh-bilingual-native-tspl-shell-v10" web/src/main.jsx
          grep -q "installTaskTemplateRefreshV6" web/src/main.jsx
          grep -q "firstLoadForOutlet" web/src/lib/task-template-refresh-v6.js
          grep -q "installLabelContentOrientationV7" web/src/main.jsx
          grep -q "rotate_content" web/src/lib/label-content-orientation-v7.js
          grep -q "translateX" web/src/lib/label-content-orientation-v7.js
          grep -q "force-raster-orientation" web/src/lib/label-content-orientation-v7.js
          grep -q "installTaskBilingualShell" web/src/main.jsx
          grep -q "已准备 / Ready" web/src/lib/task-bilingual-shell.js
          grep -q "已完成" web/src/lib/task-bilingual-shell.js
          grep -q "normalizeTaskBilingual" worker/src/task-bilingual-v5.js
          grep -q "master-task-refresh-bilingual-v6-native-tspl-v4.6.11" worker/src/entry-v3.js
          grep -q "@/label-printer-settings-v2.css" web/src/main.jsx
          grep -q "@/label-printer-settings-force-mobile.css" web/src/main.jsx
          grep -q "grid-template-columns: repeat(4, minmax(0, 1fr))" web/src/label-printer-settings-v2.css
          grep -q "position: sticky !important" web/src/label-printer-settings-v2.css
          grep -q "grid-auto-flow: column" web/src/label-printer-settings-v2.css
          grep -q "chefops-force-mobile" web/src/label-printer-settings-force-mobile.css
          grep -q "stupiaks-label-printer-profile-v4" web/src/lib/label-printer-profile.js
          grep -q "PRINTER_PRESETS" web/src/lib/label-printer-profile.js
          grep -q "printer_hardware" web/src/lib/label-printer-profile.js
          grep -q "testDirectPrinterProfile" web/src/lib/native-label-print.js
          grep -q "calibrateDirectPrinterProfile" web/src/lib/native-label-print.js
          grep -q "buildTsplFoodLabelCommand" web/src/lib/native-label-print.js
          grep -q "tspl-native-food-label" web/src/lib/tspl-food-label-compat.js
          grep -q "REFERENCE 0,0" web/src/lib/tspl-food-label-compat.js
          grep -q "BARCODE" web/src/lib/tspl-food-label-compat.js
          ! grep -q "BITMAP" web/src/lib/tspl-food-label-compat.js
          grep -q "rawCommandBase64" scripts/configure-android-tspl-food-label-compat.mjs
          grep -q "chefops-native-tspl-food-label" scripts/configure-android-tspl-food-label-compat.mjs
          grep -q "DirectLabelPrintPlugin.class" scripts/configure-android-direct-label-print.mjs
          grep -q "testConnection" scripts/configure-android-direct-label-print.mjs
          grep -q "calibrateMedia" scripts/configure-android-direct-label-print.mjs
          grep -q "sendNetworkRaw" scripts/configure-android-direct-label-print.mjs
          grep -q "sendNetworkLpr" scripts/configure-android-direct-label-print.mjs
          grep -q "GAPDETECT" scripts/configure-android-direct-label-print.mjs
          grep -q "BLINEDETECT" scripts/configure-android-direct-label-print.mjs
          grep -q "buildTspl" scripts/configure-android-direct-label-print.mjs
          grep -q "buildZpl" scripts/configure-android-direct-label-print.mjs
          grep -q "buildCpcl" scripts/configure-android-direct-label-print.mjs
          grep -q "buildEscPos" scripts/configure-android-direct-label-print.mjs
          grep -q "Quick printer preset" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "Physical media and sensor" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "Live output summary" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "position: static !important" web/src/direct-print-v10.css
          grep -q 'id="chefops-mobile-main"' web/src/components/Layout.jsx
          grep -q 'id="chefops-mobile-nav"' web/src/components/Layout.jsx
          grep -q 'refetchInterval: false' web/src/lib/query-client.js
          grep -q 'App shell: Direct Print Flow v10' web/src/pages/More.jsx
          grep -q 'purgeNativeServiceWorkers' web/src/main.jsx
          grep -q 'dashboard-v3-shell' web/src/pages/DashboardV3.jsx
          grep -q 'LabelPrinterSettingsPublic' web/src/App.jsx
          grep -q 'PrinterProfile: LEVEL.staff' worker/src/permissions.js
          ! grep -q 'installShellGuard' web/src/main.jsx
      - name: Generate and sync Capacitor Android project
        run: npm run mobile:init
      - name: Apply Stupiak's Ops Android launcher icon
        run: node scripts/configure-android-branding.mjs
      - name: Configure native Google Credential Manager, system print and mobile WebView
        run: node scripts/configure-android-native-google-auth.mjs
      - name: Configure direct printer transport and media controls
        run: node scripts/configure-android-direct-label-print.mjs
      - name: Configure native TSPL food label compatibility
        run: node scripts/configure-android-tspl-food-label-compat.mjs
      - name: Validate generated native TSPL path
        run: |
          grep -q 'rawCommandBase64' web/android/app/src/main/java/com/stupiaks/ops/DirectLabelPrintPlugin.java
          grep -q 'chefops-native-tspl-food-label' web/android/app/src/main/java/com/stupiaks/ops/DirectLabelPrintPlugin.java
          grep -q 'result.put("renderMode", renderMode)' web/android/app/src/main/java/com/stupiaks/ops/DirectLabelPrintPlugin.java
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed release APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V10_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum "release/${APK_FILE_NAME}" "release/${APK_V10_FILE_NAME}" "release/${AAB_FILE_NAME}" | tee release/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: |
            release/stupiaks-ops-release.apk
            release/stupiaks-ops-direct-print-flow-v10.apk
            release/stupiaks-ops-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_V10_FILE_NAME}#Stupiak's Ops Direct Print Flow v10 APK" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops 4.6.11 ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) built from commit ${GITHUB_SHA}. Version 4.6.11 forces one Master Sheet TaskTemplate refresh per outlet session before displaying tasks and completes dynamic Chinese and English task text. It also fixes Content Preference so Portrait and Landscape rotate only label content while the physical media width and feed length stay fixed. Rotated content uses the safe raster path; matching orientation retains native TSPL. Practical daily readiness, monthly cold-storage rotation, Duty Roster-only assignment, native TSPL 40×30 mm food-label printing and Printer Profiles remain included."
      - name: Show stable release URLs
        run: |
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_FILE_NAME}"
          echo "V10 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V10_FILE_NAME}"
          echo "AAB: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${AAB_FILE_NAME}"
