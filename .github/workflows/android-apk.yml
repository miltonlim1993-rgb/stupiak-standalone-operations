name: Build and publish signed Android release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/android-task-alarm/**'
      - 'scripts/android-app-update/**'
      - 'scripts/configure-android-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/android-task-alarm/**'
      - 'scripts/android-app-update/**'
      - 'scripts/configure-android-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_VERSION_CODE: 1
      ANDROID_VERSION_NAME: 4.5.13-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Validate closed-loop Task and update source
        run: |
          grep -q '"apk_version": "4.5.13"' web/public/app-release.json
          grep -q '"minimum_apk_version": "4.5.13"' web/public/app-release.json
          grep -q "CURRENT_RELEASE = '4.5.13'" web/src/components/AppUpdateBanner.jsx
          grep -q "AUTO_OPEN_COOLDOWN_MS" web/src/components/AppUpdateBanner.jsx
          grep -q "sw-v23.js" web/src/main.jsx
          grep -q "closed-loop-v23" web/public/sw-v23.js
          grep -q "open_time: night ? '21:00' : '10:00'" worker/src/opening-checklist-feedback.js
          grep -q "due_time: night ? '00:00' : '17:30'" worker/src/opening-checklist-feedback.js
          grep -q "due_day_offset: night ? 1 : 0" worker/src/opening-checklist-feedback.js
          grep -q "WINDOW_PREFIX" web/src/lib/roster-alert-gate.js
          grep -q "parseDutySegments" web/src/lib/roster-alert-gate.js
          grep -q "triggerAt >= Number(startAt)" web/src/lib/roster-alert-gate.js
          grep -q "RosterGatedTaskAlarmManager" web/src/App.jsx
          grep -q "syncAppPack({ outletId, force: true })" web/src/pages/DataPackage.jsx
          grep -q "A usable local package no longer stops update checks" web/src/components/DataPackGate.jsx
          grep -q "purgeNativeServiceWorkers" web/src/main.jsx
          grep -q "TaskAlarmPlugin.class" scripts/configure-android-task-alarms.mjs
          grep -q "AppUpdatePlugin.class" scripts/configure-android-app-update.mjs
      - name: Build web app
        run: npm run build -w web
      - name: Generate and configure Android debug project
        run: |
          npm run mobile:init
          node scripts/configure-android-branding.mjs
          node scripts/configure-android-native-google-auth.mjs
          node scripts/configure-android-direct-label-print.mjs
          node scripts/configure-android-task-alarms.mjs
          node scripts/configure-android-app-update.mjs
      - name: Compile debug APK
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew assembleDebug

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_ALARM_FILE_NAME: stupiaks-ops-task-sop-alarm.apk
      APK_V10_FILE_NAME: stupiaks-ops-direct-print-flow-v10.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.5.13.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Generate and configure Android release project
        run: |
          npm run mobile:init
          node scripts/configure-android-branding.mjs
          node scripts/configure-android-native-google-auth.mjs
          node scripts/configure-android-direct-label-print.mjs
          node scripts/configure-android-task-alarms.mjs
          node scripts/configure-android-app-update.mjs
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_ALARM_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V10_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum release/* | tee release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: release/
          if-no-files-found: error
      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_ALARM_FILE_NAME}#Stupiak's Ops Task and SOP alarm APK" \
            "release/${APK_V10_FILE_NAME}#Stupiak's Ops Direct Print Flow v10 APK" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops Closed Loop ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME}. Morning operational Tasks run 10:00-17:30 and night Tasks run 21:00-00:00. Task alarms are installed only when the signed-in employee is inside the matching Duty Roster time window. Android, web and installed PWA clients enforce the latest shell, data package and mandatory APK release automatically."
