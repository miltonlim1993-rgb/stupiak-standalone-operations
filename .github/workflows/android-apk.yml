name: Build and publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_STABLE_TSPL_FILE_NAME: stupiaks-ops-stable-tspl-v16.apk
      APK_V12_FILE_NAME: stupiaks-ops-all-device-print-v12.apk
      APK_V10_FILE_NAME: stupiaks-ops-direct-print-flow-v10.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.6.22-windows-queue-kitchen-ip-v24-date-fit-v22.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"

      - name: Install dependencies
        run: npm ci

      - name: Validate current shell and shared Web/APK date fit
        run: |
          set -Eeuo pipefail
          grep -q '"version": "4.6.22"' package.json
          grep -q "chefops-v4-6-22-windows-queue-kitchen-ip-service-v24" web/public/sw.js
          grep -q "4.6.22-windows-queue-kitchen-ip-service-v24" web/src/main.jsx
          grep -q "stableTsplCore: 'v16-date-fit-v22'" web/src/main.jsx
          grep -q "androidStablePrint: 'v16-date-fit-v22'" web/src/main.jsx
          grep -q "webStablePrint: 'device-local-v24-windows-queue-kitchen-ip'" web/src/main.jsx
          grep -q "labelSettingsStaff: 'two-route-service-v24'" web/src/main.jsx
          grep -q "STABLE_TSPL_LABEL_VERSION = '4.6.20-stable-tspl-core-v16-date-fit-v22'" web/src/lib/stable-tspl-label-v16.js
          grep -q "function fittedDateCommand" web/src/lib/stable-tspl-label-v16.js
          grep -q "date_box_padding_dots: 2" web/src/lib/stable-tspl-label-v16.js
          grep -q "date_font: '1x2'" web/src/lib/stable-tspl-label-v16.js
          grep -q "tspl-stable-v16-date-fit-v22" web/src/lib/stable-tspl-label-v16.js
          grep -q 'lines.push(`PRINT ${copies},1`)' web/src/lib/stable-tspl-label-v16.js
          ! grep -q "BITMAP" web/src/lib/stable-tspl-label-v16.js
          grep -q "rawCommandBase64: asciiBase64(stable.command)" web/src/lib/stable-label-print-v16.js
          grep -q "html: ''" web/src/lib/stable-label-print-v16.js
          ! grep -q "html-raster" web/src/lib/stable-label-print-v16.js
          grep -q "windows-queue-kitchen-ip-service-v24-v4.6.22" worker/src/entry-v3.js
          grep -q "LabelPrinterSettingsSimpleV20" web/src/App.jsx
          grep -q "PrinterProfile: LEVEL.staff" worker/src/permissions.js
          grep -q "shared TSPL core fits Made and Use By dates before Android transport" worker/test/android-date-fit-v22.test.mjs
          ! grep -q "installShellGuard" web/src/main.jsx

      - name: Build and run the complete validation suite
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: npm run mobile:init

      - name: Apply Stupiak's Ops Android launcher icon
        run: node scripts/configure-android-branding.mjs

      - name: Configure native Google Credential Manager, system print and mobile WebView
        run: node scripts/configure-android-native-google-auth.mjs

      - name: Configure direct printer transport and media controls
        run: node scripts/configure-android-direct-label-print.mjs

      - name: Configure native TSPL food label compatibility
        run: node scripts/configure-android-tspl-food-label-compat.mjs

      - name: Configure all-device printer transport v12
        run: node scripts/configure-android-all-device-print-v12.mjs

      - name: Validate generated Native RAW TSPL transport
        run: |
          set -Eeuo pipefail
          PLUGIN=web/android/app/src/main/java/com/stupiaks/ops/DirectLabelPrintPlugin.java
          grep -q 'public void printSystem(PluginCall call)' "$PLUGIN"
          grep -q 'sendNetworkRaw' "$PLUGIN"
          grep -q 'sendNetworkLpr' "$PLUGIN"
          grep -q 'sendBluetooth' "$PLUGIN"
          grep -q 'rawCommandBase64' "$PLUGIN"
          grep -q 'result.put("renderMode", renderMode)' "$PLUGIN"

      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks

      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs

      - name: Build signed release APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"

      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_STABLE_TSPL_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V12_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V10_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum "release/${APK_FILE_NAME}" "release/${APK_STABLE_TSPL_FILE_NAME}" "release/${APK_V12_FILE_NAME}" "release/${APK_V10_FILE_NAME}" "release/${AAB_FILE_NAME}" | tee release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: |
            release/stupiaks-ops-release.apk
            release/stupiaks-ops-stable-tspl-v16.apk
            release/stupiaks-ops-all-device-print-v12.apk
            release/stupiaks-ops-direct-print-flow-v10.apk
            release/stupiaks-ops-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_STABLE_TSPL_FILE_NAME}#Stupiak's Ops Stable TSPL v16 Date Fit v22 APK" \
            "release/${APK_V12_FILE_NAME}#Stupiak's Ops All Device Print v12 APK" \
            "release/${APK_V10_FILE_NAME}#Compatibility alias for previous Direct Print Flow APK URL" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops 4.6.22 ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) built from commit ${GITHUB_SHA}. Android now generates the Made and Use By dates through the same shared Stable TSPL core as the verified Web output: printer Font 1, vertical multiplier 2, centred inside each box with a two-dot safe edge. Native RAW TSPL LAN/Wi-Fi/Bluetooth transport, 40x30 mm media, 203 dpi, Gap 2 mm, offsets, barcode behaviour and device/outlet printer selection remain unchanged."

      - name: Show stable release URLs
        run: |
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_FILE_NAME}"
          echo "Stable TSPL APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_STABLE_TSPL_FILE_NAME}"
          echo "V12 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V12_FILE_NAME}"
          echo "Compatibility APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V10_FILE_NAME}"
          echo "AAB: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${AAB_FILE_NAME}"
