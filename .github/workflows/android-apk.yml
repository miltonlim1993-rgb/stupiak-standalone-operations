name: Build and publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_V12_FILE_NAME: stupiaks-ops-all-device-print-v12.apk
      APK_V10_FILE_NAME: stupiaks-ops-direct-print-flow-v10.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.6.12-all-device-print-v12.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Validate Tasks, orientation and all-device printer source
        run: |
          grep -q "chefops-v4-6-12-all-device-print-v12-master-task-refresh-shell-v10" web/public/sw.js
          grep -q "4.6.12-all-device-print-v12-master-task-refresh-shell-v10" web/src/main.jsx
          grep -q "installTaskTemplateRefreshV6" web/src/main.jsx
          grep -q "firstLoadForOutlet" web/src/lib/task-template-refresh-v6.js
          grep -q "installLabelContentOrientationV7" web/src/main.jsx
          grep -q "rotate_content" web/src/lib/label-content-orientation-v7.js
          grep -q "force-raster-orientation" web/src/lib/label-content-orientation-v7.js
          grep -q "installTaskBilingualShell" web/src/main.jsx
          grep -q "已准备 / Ready" web/src/lib/task-bilingual-shell.js
          grep -q "normalizeTaskBilingual" worker/src/task-bilingual-v5.js
          grep -q "master-task-refresh-bilingual-v6-native-tspl-v4.6.11" worker/src/entry-v3.js
          grep -q "PRINTER_TRANSPORT_VERSION" web/src/lib/printer-transport-v12.js
          grep -q "driver_bridge" web/src/lib/printer-transport-v12.js
          grep -q "System / Driver" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "PC/Mac Bridge" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "Direct Wi-Fi/LAN" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "Bluetooth Classic" web/src/pages/LabelPrinterSettingsPublic.jsx
          grep -q "discoverBridgePrinterQueues" web/src/lib/native-label-print.js
          grep -q "printSystem" web/src/lib/native-label-print.js
          grep -q "buildTsplFoodLabelCommand" web/src/lib/native-label-print.js
          grep -q "tspl-native-food-label" web/src/lib/tspl-food-label-compat.js
          grep -q "REFERENCE 0,0" web/src/lib/tspl-food-label-compat.js
          ! grep -q "BITMAP" web/src/lib/tspl-food-label-compat.js
          grep -q "stupiaks-print-bridge-v12" tools/print-bridge/server.mjs
          grep -q "windowsQueues" tools/print-bridge/server.mjs
          grep -q "unixQueues" tools/print-bridge/server.mjs
          grep -q "sendRawTcp" tools/print-bridge/server.mjs
          grep -q "sendLpr" tools/print-bridge/server.mjs
          grep -q "Print Bridge is installed and running" scripts/install-print-bridge-windows.ps1
          grep -q "Print Bridge is installed and running" scripts/install-print-bridge-macos.sh
          grep -q "public void printSystem(PluginCall call)" scripts/configure-android-all-device-print-v12.mjs
          grep -q "driver_bridge" scripts/configure-android-all-device-print-v12.mjs
          grep -q "X-Print-Bridge-Token" scripts/configure-android-all-device-print-v12.mjs
          grep -q "sendNetworkRaw" scripts/configure-android-all-device-print-v12.mjs
          grep -q "sendNetworkLpr" scripts/configure-android-all-device-print-v12.mjs
          grep -q "sendBluetooth" scripts/configure-android-all-device-print-v12.mjs
          grep -q "LabelPrinterSettingsPublic" web/src/App.jsx
          grep -q "PrinterProfile: LEVEL.staff" worker/src/permissions.js
          ! grep -q "installShellGuard" web/src/main.jsx
      - name: Generate and sync Capacitor Android project
        run: npm run mobile:init
      - name: Apply Stupiak's Ops Android launcher icon
        run: node scripts/configure-android-branding.mjs
      - name: Configure native Google Credential Manager, system print and mobile WebView
        run: node scripts/configure-android-native-google-auth.mjs
      - name: Configure direct printer transport and media controls
        run: node scripts/configure-android-direct-label-print.mjs
      - name: Configure native TSPL food label compatibility
        run: node scripts/configure-android-tspl-food-label-compat.mjs
      - name: Configure all-device printer transport v12
        run: node scripts/configure-android-all-device-print-v12.mjs
      - name: Validate generated all-device printer paths
        run: |
          PLUGIN=web/android/app/src/main/java/com/stupiaks/ops/DirectLabelPrintPlugin.java
          grep -q 'public void printSystem(PluginCall call)' "$PLUGIN"
          grep -q 'Android System Print / installed driver' "$PLUGIN"
          grep -q 'driver_bridge' "$PLUGIN"
          grep -q 'X-Print-Bridge-Token' "$PLUGIN"
          grep -q 'sendNetworkRaw' "$PLUGIN"
          grep -q 'sendNetworkLpr' "$PLUGIN"
          grep -q 'sendBluetooth' "$PLUGIN"
          grep -q 'rawCommandBase64' "$PLUGIN"
          grep -q 'result.put("renderMode", renderMode)' "$PLUGIN"
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed release APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V12_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V10_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum "release/${APK_FILE_NAME}" "release/${APK_V12_FILE_NAME}" "release/${APK_V10_FILE_NAME}" "release/${AAB_FILE_NAME}" | tee release/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: |
            release/stupiaks-ops-release.apk
            release/stupiaks-ops-all-device-print-v12.apk
            release/stupiaks-ops-direct-print-flow-v10.apk
            release/stupiaks-ops-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_V12_FILE_NAME}#Stupiak's Ops All Device Print v12 APK" \
            "release/${APK_V10_FILE_NAME}#Compatibility alias for previous Direct Print Flow APK URL" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops 4.6.12 ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) built from commit ${GITHUB_SHA}. Printer transport v12 separates Device System Print, Windows/macOS Driver Bridge, Android Direct Raw TCP/LPR and Android Bluetooth Classic. USB, WSD, BLE and vendor-driver printers use their installed driver; bridge queues, Raw TCP and LPR return explicit connection and print errors. Fixed 40×30 mm native TSPL, functional Portrait/Landscape content rotation, Master Sheet Task refresh and bilingual practical Tasks remain included."
      - name: Show stable release URLs
        run: |
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_FILE_NAME}"
          echo "V12 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V12_FILE_NAME}"
          echo "Compatibility APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V10_FILE_NAME}"
          echo "AAB: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${AAB_FILE_NAME}"
