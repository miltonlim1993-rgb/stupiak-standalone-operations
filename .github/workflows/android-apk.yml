name: Build and publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_V9_FILE_NAME: stupiaks-ops-native-print-panels-v9.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.5.1.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Validate native print panels v9 source
        run: |
          grep -q "native-print-panels-shell-v9" web/public/sw.js
          grep -q "native-print-panels-shell-v9" web/src/main.jsx
          grep -q "@/panels-v8.css" web/src/main.jsx
          grep -q "installNativeLabelPrintBridge" web/src/main.jsx
          grep -q "NativeLabelPrint" web/src/lib/native-label-print.js
          grep -q "NativeLabelPrintPlugin.class" scripts/configure-android-native-google-auth.mjs
          grep -q "createPrintDocumentAdapter" scripts/configure-android-native-google-auth.mjs
          grep -q "PrintManager" scripts/configure-android-native-google-auth.mjs
          grep -q "closeup-page .chefops-mobile-action" web/src/panels-v8.css
          grep -q 'id="chefops-mobile-main"' web/src/components/Layout.jsx
          grep -q 'id="chefops-mobile-nav"' web/src/components/Layout.jsx
          grep -q '#chefops-mobile-main' web/src/viewport.css
          grep -q 'max-height: var(--chefops-panel-max-height)' web/src/panels-v8.css
          grep -q 'max-height: calc(100dvh - var(--chefops-safe-top))' web/src/panels-v8.css
          grep -q 'refetchInterval: false' web/src/lib/query-client.js
          ! grep -q 'LIVE_REFRESH_MS' web/src/components/AppFoundation.jsx
          ! grep -q 'liveTimer' web/src/components/AppFoundation.jsx
          grep -q 'App shell: Native Print Panels v9' web/src/pages/More.jsx
          grep -q 'purgeNativeServiceWorkers' web/src/main.jsx
          ! grep -q 'installShellGuard' web/src/main.jsx
          ! grep -q 'chefops-viewport-height' web/src/viewport.css
          ! grep -q 'setInitialScale' scripts/configure-android-native-google-auth.mjs
      - name: Generate and sync Capacitor Android project
        run: npm run mobile:init
      - name: Apply Stupiak's Ops Android launcher icon
        run: node scripts/configure-android-branding.mjs
      - name: Configure native Google Credential Manager, print service and mobile WebView
        run: node scripts/configure-android-native-google-auth.mjs
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed release APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V9_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum "release/${APK_FILE_NAME}" "release/${APK_V9_FILE_NAME}" "release/${AAB_FILE_NAME}" | tee release/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: |
            release/stupiaks-ops-release.apk
            release/stupiaks-ops-native-print-panels-v9.apk
            release/stupiaks-ops-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_V9_FILE_NAME}#Stupiak's Ops Native Print Panels v9 APK" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops Native Print Panels v9 ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) built from commit ${GITHUB_SHA}. Native Print Panels v9 fixes the Close Up submit bar across short and tall phone screens and routes food-label printing through Android PrintManager instead of opening Chrome or Edge."
      - name: Show stable release URLs
        run: |
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_FILE_NAME}"
          echo "V9 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V9_FILE_NAME}"
          echo "AAB: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${AAB_FILE_NAME}"
