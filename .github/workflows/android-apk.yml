name: Build and publish signed Android release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/android-task-alarm/**'
      - 'scripts/android-app-update/**'
      - 'scripts/configure-android-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/android-task-alarm/**'
      - 'scripts/android-app-update/**'
      - 'scripts/configure-android-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_VERSION_CODE: 1
      ANDROID_VERSION_NAME: 4.5.15-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Validate OPS 4.5.15 mandatory update source
        run: |
          grep -q '"apk_version": "4.5.15"' web/public/app-release.json
          grep -q '"minimum_apk_version": "4.5.15"' web/public/app-release.json
          grep -q '"force_update": true' web/public/app-release.json
          grep -q '"pwa_version": "label-d1-runtime-pwa-v30"' web/public/app-release.json
          grep -q '"pwa_force_update": true' web/public/app-release.json
          grep -q "CURRENT_RELEASE = '4.5.15'" web/src/components/AppUpdateBanner.jsx
          grep -q "AUTO_OPEN_COOLDOWN_MS" web/src/components/AppUpdateBanner.jsx
          grep -q "Number(asset.size || 0) < 1_000_000" web/src/components/AppUpdateBanner.jsx
          grep -q "sw-v30.js" web/src/main.jsx
          grep -q "label-d1-runtime-pwa-v30" web/src/main.jsx
          grep -q "label-d1-runtime-pwa-v30" web/public/sw-v30.js
          grep -q "caches.delete" web/public/sw-v30.js
          grep -q "realtime-resilience-v17-label-d1-runtime" worker/src/entry.js
          grep -q "handleD1Labels" worker/src/entry.js
          test -f worker/src/label-d1-store.js
          test -f worker/src/label-d1-printer.js
          test -f worker/src/label-d1-operations.js
          grep -q "open_time: night ? '21:00' : '10:00'" worker/src/opening-checklist-feedback.js
          grep -q "due_time: night ? '00:00' : '17:30'" worker/src/opening-checklist-feedback.js
          grep -q "due_day_offset: night ? 1 : 0" worker/src/opening-checklist-feedback.js
          grep -q "WINDOW_PREFIX" web/src/lib/roster-alert-gate.js
          grep -q "parseDutySegments" web/src/lib/roster-alert-gate.js
          grep -q "Exact time-window gating applies to Task, SOP and Training alerts" web/src/lib/roster-alert-gate.js
          grep -q "return alertInsideWindow(alert, encodedWindows(scheduledKeys))" web/src/lib/roster-alert-gate.js
          grep -q "RosterGatedTaskAlarmManager" web/src/App.jsx
          grep -q "syncAppPack({ outletId })" web/src/pages/DataPackage.jsx
          grep -q "last-known-good package remains usable" web/src/components/DataPackGate.jsx
          grep -q "purgeNativeServiceWorkers" web/src/main.jsx
          grep -q "TaskAlarmPlugin.class" scripts/configure-android-task-alarms.mjs
          grep -q "AppUpdatePlugin.class" scripts/configure-android-app-update.mjs
      - name: Build web app and Worker dry-run
        run: npm run build
      - name: Generate and configure Android debug project
        run: |
          npm run mobile:init
          node scripts/configure-android-branding.mjs
          node scripts/configure-android-native-google-auth.mjs
          node scripts/configure-android-direct-label-print.mjs
          node scripts/configure-android-task-alarms.mjs
          node scripts/configure-android-app-update.mjs
      - name: Compile debug APK
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew assembleDebug

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_ALARM_FILE_NAME: stupiaks-ops-task-sop-alarm.apk
      APK_V10_FILE_NAME: stupiaks-ops-direct-print-flow-v10.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.5.15.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Generate and configure latest Android release project
        run: |
          npm run mobile:init
          node scripts/configure-android-branding.mjs
          node scripts/configure-android-native-google-auth.mjs
          node scripts/configure-android-direct-label-print.mjs
          node scripts/configure-android-task-alarms.mjs
          node scripts/configure-android-app-update.mjs
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature and embedded version
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          test -x "${AAPT}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
          "${AAPT}" dump badging "${APK_PATH}" | tee /tmp/apk-badging.txt
          grep -q "versionName='${ANDROID_VERSION_NAME}'" /tmp/apk-badging.txt
      - name: Prepare latest release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_ALARM_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V10_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          cp web/public/app-release.json release/app-release.json
          printf 'source_commit=%s\nandroid_version=%s\npwa_version=%s\n' \
            "${GITHUB_SHA}" "${ANDROID_VERSION_NAME}" "label-d1-runtime-pwa-v30" \
            > release/BUILD_INFO.txt
          sha256sum release/*.apk release/*.aab release/app-release.json release/BUILD_INFO.txt \
            | tee release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release-4.5.15
          path: release/
          if-no-files-found: error
      - name: Publish fixed latest signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_ALARM_FILE_NAME}#Stupiak's Ops mandatory latest APK" \
            "release/${APK_V10_FILE_NAME}#Stupiak's Ops Direct Print Flow v10 APK" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/app-release.json#Mandatory update manifest" \
            "release/BUILD_INFO.txt#Source commit and PWA build" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops D1 Label Runtime ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed mandatory Android release ${ANDROID_VERSION_NAME}, built from ${GITHUB_SHA}. Food Labels now use D1 for rules, printer profiles, creation, reprints and print logs; July Stock Count history is restored. Website and installed PWA clients force shell label-d1-runtime-pwa-v30, while outdated Android clients remain locked until this signed package is installed."
      - name: Verify release page and fixed download URL serve this exact APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify-release
          gh release view "${APK_RELEASE_TAG}" --json name,tagName,assets \
            | tee verify-release/release.json
          grep -q "4.5.15.${{ github.run_number }}" verify-release/release.json
          gh release download "${APK_RELEASE_TAG}" \
            --pattern "${APK_ALARM_FILE_NAME}" \
            --dir verify-release
          curl -fL --retry 8 --retry-delay 3 \
            -o verify-release/fixed-download.apk \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_ALARM_FILE_NAME}?source=${GITHUB_SHA}"
          EXPECTED_SHA="$(sha256sum "release/${APK_ALARM_FILE_NAME}" | awk '{print $1}')"
          RELEASE_SHA="$(sha256sum "verify-release/${APK_ALARM_FILE_NAME}" | awk '{print $1}')"
          FIXED_URL_SHA="$(sha256sum verify-release/fixed-download.apk | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${RELEASE_SHA}"
          test "${EXPECTED_SHA}" = "${FIXED_URL_SHA}"
          echo "LATEST_APK_SHA256=${EXPECTED_SHA}"
          echo "LATEST_APK_FIXED_URL_VERIFIED=true"
