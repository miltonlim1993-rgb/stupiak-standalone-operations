name: Build and publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_RELEASE_TAG: android-release-latest
      APK_FILE_NAME: stupiaks-ops-release.apk
      APK_V6_FILE_NAME: stupiaks-ops-fixed-viewport-v6.apk
      AAB_FILE_NAME: stupiaks-ops-release.aab
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 4.5.1.${{ github.run_number }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
      - name: Install dependencies
        run: npm ci
      - name: Validate fixed viewport shell source
        run: |
          grep -q "fixed-viewport-shell-v6" web/public/sw.js
          grep -q "fixed-viewport-shell-v6" web/src/main.jsx
          grep -q "position: absolute !important" web/src/viewport.css
          grep -q "bottom: calc(var(--chefops-bottom-height)" web/src/viewport.css
          grep -q "purgeNativeServiceWorkers" web/src/main.jsx
          grep -q "App shell: Fixed Viewport v6" web/src/pages/More.jsx
          ! grep -q "installShellGuard" web/src/main.jsx
          ! grep -q "chefops-viewport-height" web/src/viewport.css
          ! grep -q "setInitialScale" scripts/configure-android-native-google-auth.mjs
      - name: Generate and sync Capacitor Android project
        run: npm run mobile:init
      - name: Apply Stupiak's Ops Android launcher icon
        run: node scripts/configure-android-branding.mjs
      - name: Configure native Google Credential Manager and mobile WebView
        run: node scripts/configure-android-native-google-auth.mjs
      - name: Restore private release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > web/android/app/stupiaks-ops-release.jks
          chmod 600 web/android/app/stupiaks-ops-release.jks
      - name: Configure release signing
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed release APK and AAB
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK_PATH="web/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_FILE_NAME}"
          cp web/android/app/build/outputs/apk/release/app-release.apk "release/${APK_V6_FILE_NAME}"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release/${AAB_FILE_NAME}"
          sha256sum "release/${APK_FILE_NAME}" "release/${APK_V6_FILE_NAME}" "release/${AAB_FILE_NAME}" | tee release/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupiaks-ops-signed-release
          path: |
            release/stupiaks-ops-release.apk
            release/stupiaks-ops-fixed-viewport-v6.apk
            release/stupiaks-ops-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish stable signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${APK_RELEASE_TAG}" --cleanup-tag --yes || true
          gh release create "${APK_RELEASE_TAG}" \
            "release/${APK_FILE_NAME}#Stupiak's Ops signed release APK" \
            "release/${APK_V6_FILE_NAME}#Stupiak's Ops Fixed Viewport v6 APK" \
            "release/${AAB_FILE_NAME}#Stupiak's Ops signed Android App Bundle" \
            "release/SHA256SUMS.txt#SHA-256 checksums" \
            --title "Stupiak's Ops Fixed Viewport v6 ${ANDROID_VERSION_NAME}" \
            --notes "Production-signed Android release ${ANDROID_VERSION_NAME} (versionCode ${ANDROID_VERSION_CODE}) built from commit ${GITHUB_SHA}. Fixed Viewport v6 pins the header, scroll pane and bottom navigation directly to viewport coordinates, removes the runtime style guard that overrode mobile CSS, and purges native service workers so an upgraded APK cannot load an older cached shell."
      - name: Show stable release URLs
        run: |
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_FILE_NAME}"
          echo "V6 APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${APK_V6_FILE_NAME}"
          echo "AAB: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_RELEASE_TAG}/${AAB_FILE_NAME}"
