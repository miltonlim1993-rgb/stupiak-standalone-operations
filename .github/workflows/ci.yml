name: Validate source

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: validate-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate final Label printing and D1 source runtime
        run: node --test worker/test/label-final-runtime-v1.test.mjs

  audit-live-production:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/audit-live-before-label-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Read live OPS release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          origin='https://stupiaks-ops.sporkburger19.workers.dev'
          stamp="$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/app-release.json?ts=${stamp}" -o release.json
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/api/health?ts=${stamp}" -o health.json
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/?ts=${stamp}" -o index.html
          asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
          test -n "${asset}"
          curl -fsSL --retry 3 --retry-delay 2 "${origin}${asset}?ts=${stamp}" -o live-bundle.js

          echo '=== LIVE_APP_RELEASE ==='
          cat release.json
          echo
          echo '=== LIVE_HEALTH_JSON ==='
          cat health.json
          echo
          echo '=== LIVE_ASSET ==='
          echo "asset=${asset}"
          sha256sum live-bundle.js
          echo '=== LIVE_RUNTIME_MARKERS ==='
          for marker in \
            'stock-count-layout-pwa-v39' \
            'stable-tspl-v16-date-fit-v22' \
            'd1-three-stage-fifo-v26' \
            '4.6.25-label-source-fifo-v26' \
            '4.6.20-stable-tspl-core-v16-date-fit-v22' \
            'stale-aware-v1'; do
            if grep -Fq "${marker}" live-bundle.js health.json release.json; then
              echo "${marker}=present"
            else
              echo "${marker}=absent"
            fi
          done

  identify-live-production-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/audit-live-before-label-merge'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare deployed branch heads by normalized bundle and chunks
        shell: bash
        run: |
          set -euo pipefail
          origin='https://stupiaks-ops.sporkburger19.workers.dev'
          stamp="$(date +%s)"
          curl -fsSL "${origin}/?ts=${stamp}" -o /tmp/live-index.html
          live_asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' /tmp/live-index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
          curl -fsSL "${origin}${live_asset}?ts=${stamp}" -o /tmp/live-main.js

          python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path('/tmp/live-main.js').read_text(errors='replace')
          normalized = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.js', r'\1-HASH.js', raw)
          normalized = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.css', r'\1-HASH.css', normalized)
          normalized = re.sub(r'\d+-[a-z0-9-]+\.apps\.googleusercontent\.com', 'GOOGLE_CLIENT_ID', normalized, flags=re.I)
          Path('/tmp/live-main.normalized.js').write_text(normalized)
          chunks = sorted(set(re.findall(r'(?:\./)?[A-Za-z0-9_.-]+?-[A-Za-z0-9_-]{8}\.js', raw)))
          Path('/tmp/live-chunks.txt').write_text('\n'.join(chunks))
          print(f'LIVE_CHUNK_COUNT={len(chunks)}')
          print('\n'.join(chunks))
          PY
          live_norm_sha="$(sha256sum /tmp/live-main.normalized.js | awk '{print $1}')"
          live_size="$(wc -c < /tmp/live-main.normalized.js)"
          echo "LIVE_NORMALIZED_SHA256=${live_norm_sha}"
          echo "LIVE_NORMALIZED_SIZE=${live_size}"

          refs=(
            origin/deploy/stock-count-layout-pwa-v39
            origin/release/stock-count-layout-pwa-v39-align
            origin/verify/stock-count-pwa-v39-live
            origin/verify/stock-count-pwa-v39-pr-check
            origin/ops/activate-local-auth-production
            origin/ops/fix-local-auth-r2-coupling
            origin/feat/owner-approved-local-auth
            origin/fix/local-auth-free-worker-hash
            origin/fix/local-email-d1-only
            origin/fix/local-setup-diagnostics-realtime-overflow
            origin/feat/simplified-email-approval-login
            origin/feat/retire-google-login-d1-credential-reset
            origin/fix/existing-account-first-credential-setup
            origin/fix/first-login-credential-setup
            origin/agent/cloudflare-canonical-90-day-media-retention
            origin/feat/autonomous-runtime-r2-service-account
            origin/fix/autonomous-bootstrap-sheet-links
            origin/fix/master-watch-spreadsheet-binding
            origin/fix/master-watch-sheets-fingerprint
            origin/fix/master-watch-deploy-propagation
            origin/fix/master-watch-deploy-verification
            origin/fix/master-data-auto-pack-refresh
          )

          : > /tmp/scores.tsv
          for ref in "${refs[@]}"; do
            if ! git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              echo "SKIP_UNKNOWN_REF=${ref}"
              continue
            fi
            git checkout --force "${ref}"
            sha="$(git rev-parse HEAD)"
            rm -rf web/dist
            npm run build -w web >/tmp/build.log 2>&1
            asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' web/dist/index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
            file="web/dist${asset}"
            REF="${ref}" SHA="${sha}" FILE="${file}" LIVE_SHA="${live_norm_sha}" LIVE_SIZE="${live_size}" python3 - <<'PY' >> /tmp/scores.tsv
          import hashlib, os, re
          from pathlib import Path
          ref = os.environ['REF']
          sha = os.environ['SHA']
          raw = Path(os.environ['FILE']).read_text(errors='replace')
          normalized = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.js', r'\1-HASH.js', raw)
          normalized = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.css', r'\1-HASH.css', normalized)
          normalized = re.sub(r'\d+-[a-z0-9-]+\.apps\.googleusercontent\.com', 'GOOGLE_CLIENT_ID', normalized, flags=re.I)
          norm_sha = hashlib.sha256(normalized.encode()).hexdigest()
          live_chunks = set(Path('/tmp/live-chunks.txt').read_text().splitlines())
          cand_chunks = set(re.findall(r'(?:\./)?[A-Za-z0-9_.-]+?-[A-Za-z0-9_-]{8}\.js', raw))
          common = len(live_chunks & cand_chunks)
          union = len(live_chunks | cand_chunks)
          jaccard = common / union if union else 1.0
          size_delta = abs(len(normalized) - int(os.environ['LIVE_SIZE']))
          exact = int(norm_sha == os.environ['LIVE_SHA'])
          print(f'{exact}\t{common}\t{jaccard:.9f}\t{size_delta}\t{norm_sha}\t{sha}\t{ref}')
          PY
          done

          echo '=== DEPLOYED_BRANCH_HEAD_SCORES ==='
          sort -t$'\t' -k1,1nr -k2,2nr -k3,3nr -k4,4n /tmp/scores.tsv
          best="$(sort -t$'\t' -k1,1nr -k2,2nr -k3,3nr -k4,4n /tmp/scores.tsv | head -n 1)"
          echo "BEST_LIVE_BRANCH_CANDIDATE=${best}"
