name: Validate source

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate final Label printing and D1 source runtime
        run: node --test worker/test/label-final-runtime-v1.test.mjs
