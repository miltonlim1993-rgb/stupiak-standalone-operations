name: Validate source

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: validate-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate final Label printing and D1 source runtime
        run: node --test worker/test/label-final-runtime-v1.test.mjs

  audit-live-production:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/audit-live-before-label-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Read live OPS release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          origin='https://stupiaks-ops.sporkburger19.workers.dev'
          stamp="$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/app-release.json?ts=${stamp}" -o release.json
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/api/health?ts=${stamp}" -o health.json
          curl -fsSL --retry 3 --retry-delay 2 "${origin}/?ts=${stamp}" -o index.html
          asset="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
          test -n "${asset}"
          curl -fsSL --retry 3 --retry-delay 2 "${origin}${asset}?ts=${stamp}" -o live-bundle.js
          echo '=== LIVE_APP_RELEASE ==='
          cat release.json
          echo
          echo '=== LIVE_HEALTH_JSON ==='
          cat health.json
          echo
          echo '=== LIVE_ASSET ==='
          echo "asset=${asset}"
          sha256sum live-bundle.js
          echo '=== LIVE_RUNTIME_MARKERS ==='
          for marker in \
            'stock-count-layout-pwa-v39' \
            'stable-tspl-v16-date-fit-v22' \
            'd1-three-stage-fifo-v26' \
            '4.6.25-label-source-fifo-v26' \
            '4.6.20-stable-tspl-core-v16-date-fit-v22' \
            'stale-aware-v1'; do
            if grep -Fq "${marker}" live-bundle.js health.json release.json; then
              echo "${marker}=present"
            else
              echo "${marker}=absent"
            fi
          done

  inspect-live-main-delta:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/audit-live-before-label-merge'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect live versus pre-Label main entry
        shell: bash
        run: |
          set -euo pipefail
          origin='https://stupiaks-ops.sporkburger19.workers.dev'
          stamp="$(date +%s)"
          curl -fsSL "${origin}/?ts=${stamp}" -o /tmp/live-index.html
          live_main_path="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' /tmp/live-index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
          curl -fsSL "${origin}${live_main_path}?ts=${stamp}" -o /tmp/live-main.js

          git checkout --force fa3fc542fe497bf6b63273163f11e96a09c26bf8
          rm -rf web/dist
          npm run build -w web >/tmp/build.log 2>&1
          candidate_main_path="$(grep -oE 'src=\"/assets/[^\"]+\.js\"' web/dist/index.html | head -n 1 | sed -E 's/^src=\"([^\"]+)\"$/\1/')"
          cp "web/dist${candidate_main_path}" /tmp/candidate-main.js

          python3 - <<'PY'
          import re
          from pathlib import Path
          def norm(s):
              s = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.js', r'\1-HASH.js', s)
              s = re.sub(r'((?:\./)?[A-Za-z0-9_.-]+?)-[A-Za-z0-9_-]{8}\.css', r'\1-HASH.css', s)
              s = re.sub(r'\d+-[a-z0-9-]+\.apps\.googleusercontent\.com', 'GOOGLE_CLIENT_ID', s, flags=re.I)
              return s
          def strings(text):
              vals=[]
              for m in re.finditer(r'"((?:\\.|[^"\\])*)"|\'((?:\\.|[^\'\\])*)\'', text):
                  v=m.group(1) if m.group(1) is not None else m.group(2)
                  v=norm(v)
                  if 3 <= len(v) <= 300:
                      vals.append(v)
              return set(vals)
          live_raw=Path('/tmp/live-main.js').read_text(errors='replace')
          cand_raw=Path('/tmp/candidate-main.js').read_text(errors='replace')
          live=strings(live_raw)
          cand=strings(cand_raw)
          live_only=sorted(live-cand, key=lambda x:(len(x),x))
          cand_only=sorted(cand-live, key=lambda x:(len(x),x))
          print(f'LIVE_MAIN_BYTES={len(live_raw)}')
          print(f'CANDIDATE_MAIN_BYTES={len(cand_raw)}')
          print(f'LIVE_ONLY_STRING_COUNT={len(live_only)}')
          print(f'CANDIDATE_ONLY_STRING_COUNT={len(cand_only)}')
          print('=== LIVE_ONLY_STRINGS ===')
          for v in live_only[:250]: print(repr(v))
          print('=== CANDIDATE_ONLY_STRINGS ===')
          for v in cand_only[:250]: print(repr(v))
          PY
