name: One-time Close Up sync patch

on:
  push:
    paths:
      - '.github/closeup-sync-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch-closeup-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/closeup-daily-row-2026-07-31
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Close Up daily row fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('worker/src/closeup-sync.js')
          source = path.read_text()

          source = source.replace(
              "const APP_VERSION = '4.3.0-ops-insights-data-gate'",
              "const APP_VERSION = '4.3.1-closeup-daily-row-fix'",
              1,
          )

          old_date_key = r'''function dateKey(value) {
            const raw = text(value)
            let match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/)
            if (match) return `${match[1]}-${match[2]}-${match[3]}`
            match = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/)
            if (match) return `${match[3]}-${String(match[2]).padStart(2, '0')}-${String(match[1]).padStart(2, '0')}`
            return raw
          }'''

          new_date_key = r'''const MONTH_NUMBERS = new Map([
            ['jan', 1], ['january', 1],
            ['feb', 2], ['february', 2],
            ['mar', 3], ['march', 3],
            ['apr', 4], ['april', 4],
            ['may', 5],
            ['jun', 6], ['june', 6],
            ['jul', 7], ['july', 7],
            ['aug', 8], ['august', 8],
            ['sep', 9], ['sept', 9], ['september', 9],
            ['oct', 10], ['october', 10],
            ['nov', 11], ['november', 11],
            ['dec', 12], ['december', 12],
          ])

          function dateKey(value) {
            const raw = text(value)
            if (!raw) return ''

            const serial = typeof value === 'number'
              ? value
              : (/^\d+(?:\.\d+)?$/.test(raw) ? Number(raw) : Number.NaN)
            if (Number.isFinite(serial) && serial >= 20000 && serial <= 80000) {
              const date = new Date(Date.UTC(1899, 11, 30) + Math.floor(serial) * 86400000)
              return date.toISOString().slice(0, 10)
            }

            let match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/)
            if (match) return `${match[1]}-${match[2]}-${match[3]}`

            match = raw.match(/^(\d{1,2})[-\s]([a-zA-Z]{3,9})[-\s](\d{2}|\d{4})$/)
            if (match) {
              const month = MONTH_NUMBERS.get(match[2].toLowerCase())
              if (month) {
                const shortYear = Number(match[3])
                const year = match[3].length === 2
                  ? (shortYear >= 70 ? 1900 + shortYear : 2000 + shortYear)
                  : shortYear
                return `${year}-${String(month).padStart(2, '0')}-${String(match[1]).padStart(2, '0')}`
              }
            }

            match = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/)
            if (match) {
              const first = Number(match[1])
              const second = Number(match[2])
              const day = first > 12 && second <= 12 ? first : (second > 12 && first <= 12 ? second : first)
              const month = first > 12 && second <= 12 ? second : (second > 12 && first <= 12 ? first : second)
              return `${match[3]}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
            }

            const parsed = Date.parse(raw)
            if (!Number.isNaN(parsed)) return new Date(parsed).toISOString().slice(0, 10)
            return raw
          }'''

          if old_date_key not in source:
              raise SystemExit('Original dateKey implementation not found')
          source = source.replace(old_date_key, new_date_key, 1)

          handover_payments = '''    const amounts = amountMap(record)\n    PAYMENT_HEADERS.forEach((mapping) => updateCell(updates, relation, rowNumber, mapping.header, paymentValue(amounts, mapping.aliases)))\n  } else if (phase === 'closing') {'''
          replacement = '''  } else if (phase === 'closing') {'''
          if handover_payments not in source:
              raise SystemExit('Handover payment overwrite block not found')
          source = source.replace(handover_payments, replacement, 1)

          required = [
              "4.3.1-closeup-daily-row-fix",
              "const MONTH_NUMBERS = new Map",
              "serial >= 20000 && serial <= 80000",
              "match[2].toLowerCase()",
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'Missing marker after patch: {marker}')

          path.write_text(source)
          PY

          git diff --check
          grep -F "4.3.1-closeup-daily-row-fix" worker/src/closeup-sync.js
          grep -F "serial >= 20000 && serial <= 80000" worker/src/closeup-sync.js
          if sed -n "/phase === 'handover'/,/phase === 'closing'/p" worker/src/closeup-sync.js | grep -F "PAYMENT_HEADERS.forEach"; then
            echo 'Handover still writes payment columns' >&2
            exit 1
          fi

      - name: Commit fix branch
        shell: bash
        run: |
          git config user.name "stupiaks-ops-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker/src/closeup-sync.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep Close Up phases on one daily row"
          git push origin HEAD:fix/closeup-daily-row-2026-07-31
