name: Detect Cloudflare secret names v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-cloudflare-secret-names-v2.yml

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      S_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      S_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      S_CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
      S_APP_DATA_PACKS_ID: ${{ secrets.APP_DATA_PACKS_ID }}
      S_CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect without exposing values
        shell: bash
        run: |
          present() { if [[ -n "$1" ]]; then echo present; else echo missing; fi; }
          mkdir -p .deployments
          {
            echo "CLOUDFLARE_API_TOKEN=$(present "$S_CLOUDFLARE_API_TOKEN")"
            echo "CF_API_TOKEN=$(present "$S_CF_API_TOKEN")"
            echo "CLOUDFLARE_TOKEN=$(present "$S_CLOUDFLARE_TOKEN")"
            echo "CLOUDFLARE_API_KEY=$(present "$S_CLOUDFLARE_API_KEY")"
            echo "CLOUDFLARE_ACCOUNT_ID=$(present "$S_CLOUDFLARE_ACCOUNT_ID")"
            echo "CF_ACCOUNT_ID=$(present "$S_CF_ACCOUNT_ID")"
            echo "CLOUDFLARE_APP_DATA_PACKS_ID=$(present "$S_CLOUDFLARE_APP_DATA_PACKS_ID")"
            echo "APP_DATA_PACKS_ID=$(present "$S_APP_DATA_PACKS_ID")"
            echo "CLOUDFLARE_MEDIA_BUCKET_NAME=$(present "$S_CLOUDFLARE_MEDIA_BUCKET_NAME")"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .deployments/cloudflare-secret-names-v2.txt
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/check-cloudflare-secret-names-v2.yml
          git rm -f .github/workflows/deploy-data-pack-refresh-hotfix.yml || true
          git add .deployments/cloudflare-secret-names-v2.txt
          git commit -m "Record actual Cloudflare secret name availability"
          git push origin HEAD:main
