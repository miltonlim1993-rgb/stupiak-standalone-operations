name: Verify stale-aware canonical OPS production now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-stale-aware-production-now.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll canonical OPS production
        shell: bash
        run: |
          origin='https://stupiaks-ops.sporkburger19.workers.dev'
          success=false
          response=''
          for attempt in $(seq 1 36); do
            response=$(curl -fsS --max-time 20 "$origin/api/health" || true)
            if grep -q 'stale-aware-v1' <<<"$response" && grep -q '120000' <<<"$response"; then
              success=true
              break
            fi
            sleep 10
          done

          mkdir -p .deployments
          {
            echo "canonical_origin=$origin"
            echo "stale_aware_verified=$success"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "health_response=$response"
          } > .deployments/stale-aware-production-final-verification.txt

      - name: Record result and remove verifier
        shell: bash
        run: |
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/verify-stale-aware-production-now.yml
          git add .deployments/stale-aware-production-final-verification.txt
          git commit -m "Record final stale-aware production verification"
          git push origin HEAD:main
