name: One-time data pack refresh hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-data-pack-refresh.yml

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale-aware manifest publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('worker/src/index.js')
          index_text = index_path.read_text()
          old = """    const force = url.searchParams.get('refresh') === '1' && ['manager', 'owner'].includes(user.role)
              const manifest = force
                ? await getOrBuildAppPack(env, requestedOutlet, { force: true })
                : await getPublishedAppPack(env, requestedOutlet)
          """
          new = """    const refreshRequested = url.searchParams.get('refresh') === '1'
              const privilegedForce = refreshRequested && ['manager', 'owner'].includes(user.role)
              // Every client manifest check is stale-aware. Staff never force an
              // unconditional rebuild, but they can no longer be trapped on an old
              // published package after a direct Master Sheet update.
              const manifest = await getOrBuildAppPack(env, requestedOutlet, { force: privilegedForce })
          """
          if old not in index_text:
              raise SystemExit('Expected manifest block was not found; refusing an unsafe patch')
          index_path.write_text(index_text.replace(old, new, 1))

          pack_path = Path('worker/src/app-pack.js')
          pack_text = pack_path.read_text()
          old_age = 'const PACK_MAX_AGE_MS = 15 * 60 * 1000'
          new_age = 'const PACK_MAX_AGE_MS = 2 * 60 * 1000'
          if old_age not in pack_text:
              raise SystemExit('Expected pack max age was not found; refusing an unsafe patch')
          pack_path.write_text(pack_text.replace(old_age, new_age, 1))
          PY
      - name: Validate source
        run: |
          grep -q "Every client manifest check is stale-aware" worker/src/index.js
          grep -q "const PACK_MAX_AGE_MS = 2 \* 60 \* 1000" worker/src/app-pack.js
          node --check worker/src/index.js
          node --check worker/src/app-pack.js
      - name: Commit hotfix and remove one-time workflow
        run: |
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hotfix-data-pack-refresh.yml
          git add worker/src/index.js worker/src/app-pack.js
          git commit -m "Fix stale Task data package publishing"
          git push origin HEAD:main
