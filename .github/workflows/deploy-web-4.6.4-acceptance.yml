name: Deploy Web 4.6.4 acceptance

on:
  pull_request:
    branches:
      - feature/data-package-v2
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: web-4.6.4-acceptance
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.ref == 'feature/task-workflow-v3-apk'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
      CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production deployment secrets
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_APP_DATA_PACKS_ID}"

      - name: Align lockfile metadata for 4.6.4
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build, test and deploy Worker plus Web assets
        run: npm run cf:deploy

      - name: Verify deployed 4.6.4 revision and shell cache
        run: |
          set -euo pipefail
          base='https://stupiaks-ops.sporkburger19.workers.dev'
          verified=''
          for attempt in $(seq 1 18); do
            headers="$(curl -fsSI --max-time 20 "${base}/?acceptance=4.6.4-${GITHUB_RUN_ID}-${attempt}" || true)"
            shell="$(curl -fsS --max-time 20 "${base}/sw.js?acceptance=4.6.4-${GITHUB_RUN_ID}-${attempt}" || true)"
            if printf '%s' "${headers}" | grep -Eqi '^x-chefops-worker-revision:[[:space:]]*printer-profiles-v4\.6\.4' \
              && printf '%s' "${shell}" | grep -q 'chefops-v4-6-4-printer-profiles-direct-print-flow-shell-v10'; then
              verified='yes'
              break
            fi
            sleep 5
          done
          test "${verified}" = 'yes'
          printf '%s\n' "${headers}"
          printf '%s\n' "${shell}" | grep 'const VERSION'

      - name: Confirm no operational data publication ran
        run: |
          echo 'This workflow deploys source and static assets only.'
          echo 'It does not run package:publish-drive, tasks:v4:sample-photos:apply, sheets:upgrade, sheets:create-year, or any Ops Control publication action.'
