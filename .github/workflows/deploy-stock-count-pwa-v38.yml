name: Deploy final Label runtime to production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-stock-count-pwa-v38.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-final-label-runtime-production
  cancel-in-progress: true

env:
  DEPLOYMENT_RUN_ID: final-label-runtime-direct-20260806-1315
  DEPLOYMENT_STATUS_ISSUE: "70"
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
  CLOUDFLARE_OPS_DB_ID: 080c13d7-e2f5-4c01-a1ca-aa00094d6fc0
  CLOUDFLARE_SHEET_SYNC_QUEUE_NAME: stupiaks-ops-sheet-sync
  CLOUDFLARE_SHEET_SYNC_DLQ_NAME: stupiaks-ops-sheet-sync-dlq
  CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}

jobs:
  deploy-final-label-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish deployment start to PR 70
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${DEPLOYMENT_STATUS_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "$(cat <<EOF
          ## Final Label runtime production deployment: STARTED

          - Run ID: \`${DEPLOYMENT_RUN_ID}\`
          - Commit: \`${GITHUB_SHA}\`
          - Production: \`${OPS_PRODUCTION_ORIGIN}\`
          - Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          echo "CLOUDFLARE_CREDENTIALS_RESOLVED=true"

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and architecture
        run: npm run ops:audit:contract

      - name: Build Web/PWA and validate Worker
        run: npm run build

      - name: Validate final Label regression contract
        run: node --test worker/test/label-final-runtime-v1.test.mjs

      - name: Render canonical production bindings
        run: npm run cf:render

      - name: Deploy Worker and Web/PWA assets
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - name: Verify final Label runtime on production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)"
            release="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/app-release.json?attempt=${attempt}&ts=${stamp}" || true)"
            health="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/api/health?attempt=${attempt}&ts=${stamp}" || true)"
            index="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/?attempt=${attempt}&ts=${stamp}" || true)"
            asset="$(grep -oE 'src="/assets/[^"]+\.js"' <<<"${index}" | head -n 1 | cut -d'"' -f2 || true)"
            bundle=""
            if [[ -n "${asset}" ]]; then
              bundle="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}${asset}?attempt=${attempt}&ts=${stamp}" || true)"
            fi

            if grep -Fq '"pwa_version": "stock-count-layout-pwa-v39"' <<<"${release}" \
              && [[ -n "${health}" ]] \
              && grep -Fq 'stable-tspl-v16-date-fit-v22' <<<"${bundle}" \
              && grep -Fq 'd1-three-stage-fifo-v26' <<<"${bundle}"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              echo "LIVE_PWA_VERSION=stock-count-layout-pwa-v39"
              echo "LIVE_LABEL_PRINTING=stable-tspl-v16-date-fit-v22"
              echo "LIVE_LABEL_SOURCE=d1-three-stage-fifo-v26"
              echo "PRODUCTION_DEPLOYMENT_VERIFIED=true"
              exit 0
            fi
            sleep 10
          done

          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "Production did not expose the final Label runtime within the verification window" >&2
          exit 1

      - name: Publish final deployment status to PR 70
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
          LIVE_VERIFIED: ${{ steps.verify.outputs.verified }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${DEPLOYMENT_JOB_STATUS}" == "success" && "${LIVE_VERIFIED}" == "true" ]]; then
            result="SUCCESS"
          else
            result="FAILED"
          fi
          gh issue comment "${DEPLOYMENT_STATUS_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "$(cat <<EOF
          ## Final Label runtime production deployment: ${result}

          - Run ID: \`${DEPLOYMENT_RUN_ID}\`
          - Commit: \`${GITHUB_SHA}\`
          - Job status: \`${DEPLOYMENT_JOB_STATUS}\`
          - Live runtime verified: \`${LIVE_VERIFIED:-false}\`
          - Expected print runtime: \`stable-tspl-v16-date-fit-v22\`
          - Expected source runtime: \`d1-three-stage-fifo-v26\`
          - Production: \`${OPS_PRODUCTION_ORIGIN}\`
          - Workflow: ${run_url}
          - Checked at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          EOF
          )"
