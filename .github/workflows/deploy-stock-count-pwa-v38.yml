name: Deploy final Label runtime to production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-stock-count-pwa-v38.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-final-label-runtime-production
  cancel-in-progress: true

env:
  DEPLOYMENT_RUN_ID: final-label-runtime-canonical-20260806-1305
  DEPLOYMENT_STATUS_ISSUE: "70"
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
  VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
  CLOUDFLARE_OPS_DB_ID: 080c13d7-e2f5-4c01-a1ca-aa00094d6fc0
  CLOUDFLARE_SHEET_SYNC_QUEUE_NAME: stupiaks-ops-sheet-sync
  CLOUDFLARE_SHEET_SYNC_DLQ_NAME: stupiaks-ops-sheet-sync-dlq
  CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}

jobs:
  deploy-final-label-runtime:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve existing Cloudflare credentials safely
        id: credentials
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
          DIRECT_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIRECT_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}')
          const vars = JSON.parse(process.env.ALL_VARS_JSON || '{}')
          const combined = { ...vars, ...secrets }
          const entries = Object.entries(combined)
            .map(([name, value]) => [name, String(value || '').trim()])
            .filter(([, value]) => value)

          function byName(names) {
            for (const name of names) {
              const value = String(combined[name] || '').trim()
              if (value) return { name, value }
            }
            return null
          }

          function byPattern(pattern) {
            for (const [name, value] of entries) {
              if (pattern.test(name)) return { name, value }
            }
            return null
          }

          function appendEnv(name, value) {
            const marker = `OPS_${name}_${Date.now()}_${Math.random().toString(16).slice(2)}`
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${marker}\n${value}\n${marker}\n`)
          }

          function output(name, value) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value || '').replace(/[\r\n]/g, ' ')}\n`)
          }

          const directToken = String(process.env.DIRECT_TOKEN || '').trim()
          const token = directToken
            ? { name: 'CLOUDFLARE_API_TOKEN', value: directToken }
            : byName([
                'CLOUDFLARE_API_TOKEN',
                'CF_API_TOKEN',
                'WRANGLER_API_TOKEN',
                'CLOUDFLARE_WORKERS_API_TOKEN',
                'CLOUDFLARE_TOKEN',
                'CF_TOKEN',
              ])
              || byPattern(/(?:cloudflare|wrangler|^cf[_-]).*(?:api[_-]?)?token|(?:api[_-]?)?token.*(?:cloudflare|wrangler|^cf[_-])/i)

          const apiKey = byName(['CLOUDFLARE_API_KEY', 'CF_API_KEY'])
            || byPattern(/(?:cloudflare|^cf[_-]).*api.*key|api.*key.*(?:cloudflare|^cf[_-])/i)
          const email = byName(['CLOUDFLARE_EMAIL', 'CF_EMAIL'])
            || byPattern(/(?:cloudflare|^cf[_-]).*email|email.*(?:cloudflare|^cf[_-])/i)

          const directAccount = String(process.env.DIRECT_ACCOUNT || '').trim()
          const account = directAccount
            ? { name: 'CLOUDFLARE_ACCOUNT_ID', value: directAccount }
            : byName(['CLOUDFLARE_ACCOUNT_ID', 'CF_ACCOUNT_ID', 'CLOUDFLARE_ACCOUNT'])
              || byPattern(/(?:cloudflare|^cf[_-]).*account.*id|account.*id.*(?:cloudflare|^cf[_-])/i)

          let authMode = 'none'
          let authName = 'none'
          if (token) {
            appendEnv('CLOUDFLARE_API_TOKEN', token.value)
            authMode = 'api-token'
            authName = token.name
          } else if (apiKey && email) {
            appendEnv('CLOUDFLARE_API_KEY', apiKey.value)
            appendEnv('CLOUDFLARE_EMAIL', email.value)
            authMode = 'global-api-key'
            authName = `${apiKey.name}+${email.name}`
          }
          if (account) appendEnv('CLOUDFLARE_ACCOUNT_ID', account.value)

          output('auth_mode', authMode)
          output('auth_name', authName)
          output('account_name', account?.name || 'none')

          console.log(`Selected auth mode: ${authMode}`)
          console.log(`Selected auth name: ${authName}`)
          console.log(`Selected account name: ${account?.name || 'none'}`)

          if (authMode === 'none') {
            console.error('No usable Cloudflare credential is visible to the production environment')
            process.exit(2)
          }
          if (!account) {
            console.error('No Cloudflare account ID is visible to the production environment')
            process.exit(3)
          }
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Validate source and architecture
        run: npm run ops:audit:contract

      - name: Build Web/PWA and validate Worker
        run: npm run build

      - name: Validate final Label regression contract
        run: node --test worker/test/label-final-runtime-v1.test.mjs

      - name: Render canonical production bindings
        run: npm run cf:render

      - name: Deploy Worker and Web/PWA assets
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - name: Verify final Label runtime on production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp="$(date +%s)"
            release="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/app-release.json?attempt=${attempt}&ts=${stamp}" || true)"
            health="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/api/health?attempt=${attempt}&ts=${stamp}" || true)"
            index="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}/?attempt=${attempt}&ts=${stamp}" || true)"
            asset="$(grep -oE 'src="/assets/[^"]+\.js"' <<<"${index}" | head -n 1 | cut -d'"' -f2 || true)"
            bundle=""
            if [[ -n "${asset}" ]]; then
              bundle="$(curl -fsSL --retry 2 --retry-delay 2 "${OPS_PRODUCTION_ORIGIN}${asset}?attempt=${attempt}&ts=${stamp}" || true)"
            fi

            if grep -Fq '"pwa_version": "stock-count-layout-pwa-v39"' <<<"${release}" \
              && [[ -n "${health}" ]] \
              && grep -Fq 'stable-tspl-v16-date-fit-v22' <<<"${bundle}" \
              && grep -Fq 'd1-three-stage-fifo-v26' <<<"${bundle}"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              echo "LIVE_PWA_VERSION=stock-count-layout-pwa-v39"
              echo "LIVE_LABEL_PRINTING=stable-tspl-v16-date-fit-v22"
              echo "LIVE_LABEL_SOURCE=d1-three-stage-fifo-v26"
              echo "PRODUCTION_DEPLOYMENT_VERIFIED=true"
              exit 0
            fi
            sleep 10
          done

          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "Production did not expose the final Label runtime within the verification window" >&2
          exit 1

      - name: Publish deployment status to PR 70
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
          LIVE_VERIFIED: ${{ steps.verify.outputs.verified }}
          AUTH_MODE: ${{ steps.credentials.outputs.auth_mode }}
          AUTH_NAME: ${{ steps.credentials.outputs.auth_name }}
          ACCOUNT_NAME: ${{ steps.credentials.outputs.account_name }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${DEPLOYMENT_JOB_STATUS}" == "success" && "${LIVE_VERIFIED}" == "true" ]]; then
            result="SUCCESS"
          else
            result="FAILED"
          fi
          gh issue comment "${DEPLOYMENT_STATUS_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body "$(cat <<EOF
          ## Final Label runtime production deployment: ${result}

          - Run ID: \`${DEPLOYMENT_RUN_ID}\`
          - Commit: \`${GITHUB_SHA}\`
          - Job status: \`${DEPLOYMENT_JOB_STATUS}\`
          - Live runtime verified: \`${LIVE_VERIFIED:-false}\`
          - Expected print runtime: \`stable-tspl-v16-date-fit-v22\`
          - Expected source runtime: \`d1-three-stage-fifo-v26\`
          - Auth mode selected: \`${AUTH_MODE:-none}\`
          - Auth setting selected: \`${AUTH_NAME:-none}\`
          - Account setting selected: \`${ACCOUNT_NAME:-none}\`
          - Production: \`${OPS_PRODUCTION_ORIGIN}\`
          - Workflow: ${run_url}
          - Checked at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          EOF
          )"
