name: Find existing Cloudflare credential names safely

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/find-existing-cloudflare-credential-names.yml

permissions:
  contents: write

jobs:
  inspect-repository:
    runs-on: ubuntu-latest
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      ALL_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record only relevant credential names
        shell: bash
        run: |
          node <<'NODE' > /tmp/repo-names.txt
          const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}')
          const vars = JSON.parse(process.env.ALL_VARS_JSON || '{}')
          const relevant = name => /(cloudflare|wrangler|worker|^cf[_-])/i.test(name)
          for (const name of Object.keys(secrets).filter(relevant).sort()) console.log(`repository_secret=${name}`)
          for (const name of Object.keys(vars).filter(relevant).sort()) console.log(`repository_variable=${name}`)
          NODE

  inspect-production-environment:
    runs-on: ubuntu-latest
    environment: production
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      ALL_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record only relevant credential names and finish
        shell: bash
        run: |
          mkdir -p .deployments
          node <<'NODE' > .deployments/cloudflare-credential-names-current.txt
          const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}')
          const vars = JSON.parse(process.env.ALL_VARS_JSON || '{}')
          const relevant = name => /(cloudflare|wrangler|worker|^cf[_-])/i.test(name)
          for (const name of Object.keys(secrets).filter(relevant).sort()) console.log(`production_visible_secret=${name}`)
          for (const name of Object.keys(vars).filter(relevant).sort()) console.log(`production_visible_variable=${name}`)
          if (!Object.keys(secrets).some(relevant) && !Object.keys(vars).some(relevant)) console.log('production_visible_cloudflare_names=none')
          NODE
          echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .deployments/cloudflare-credential-names-current.txt
          git config user.name "stupiaks-ops-release"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/find-existing-cloudflare-credential-names.yml
          git add .deployments/cloudflare-credential-names-current.txt
          git commit -m "Record existing Cloudflare credential names"
          git push origin HEAD:main
