name: Monitor Task realtime fix production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect-direct-production:
    runs-on: ubuntu-latest
    steps:
      - name: Capture direct deploy run details
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "31145943735"
          STATUS_PATH: .ops-deploy-status/task-realtime-action-required-run-view.txt
        shell: bash
        run: |
          set -euo pipefail
          { gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY"; echo; gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,name,displayTitle,event,status,conclusion,workflowName,headBranch,headSha,url,createdAt,updatedAt; } > /tmp/run-view.txt 2>&1 || true
          encoded="$(base64 -w0 /tmp/run-view.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: capture Task deploy action-required run view' -f content="$encoded"
