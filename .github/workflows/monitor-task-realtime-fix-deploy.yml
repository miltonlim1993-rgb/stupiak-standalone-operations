name: Monitor Task realtime fix production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect-canonical-production:
    runs-on: ubuntu-latest
    steps:
      - name: Persist canonical deploy workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PATH: .ops-deploy-status/canonical-deploy-history-20260807.json
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-stock-count-pwa-v38.yml --branch main --limit 20 --json databaseId,status,conclusion,url,headSha,createdAt,event,displayTitle)"
          encoded="$(printf '%s' "$result" | base64 -w0)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record canonical deploy workflow history' -f content="$encoded"
