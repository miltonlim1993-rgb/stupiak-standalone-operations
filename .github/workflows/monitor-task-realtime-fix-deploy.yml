name: Monitor Task realtime fix production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for canonical production deployment and report
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AFTER: "2026-08-07T03:47:00Z"
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 24); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-stock-count-pwa-v38.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,createdAt -q ".[] | select(.createdAt >= \"${STARTED_AFTER}\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body "Production deploy monitor did not find a canonical workflow_dispatch run after ${STARTED_AFTER}."
            exit 1
          fi
          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          watch_status=$?
          set -e
          result="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,headSha -q '{status: .status, conclusion: .conclusion, url: .url, headSha: .headSha}')"
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body "## Task realtime production deploy monitor\n\n- Canonical run ID: \`${run_id}\`\n- Result: \`${result}\`"
          exit "$watch_status"
