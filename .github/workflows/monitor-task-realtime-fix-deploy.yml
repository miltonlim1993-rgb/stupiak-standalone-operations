name: Monitor Task realtime fix production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect-direct-production:
    runs-on: ubuntu-latest
    steps:
      - name: Persist latest direct deploy workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PATH: .ops-deploy-status/task-realtime-marker-run.json
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-task-realtime-fix-once.yml --branch main --limit 10 --json databaseId,status,conclusion,url,headSha,createdAt,event,displayTitle -q '.[0]')"
          if [[ -z "$result" || "$result" == "null" ]]; then result='{"found":false}'; fi
          encoded="$(printf '%s' "$result" | base64 -w0)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record marker-triggered Task deploy run' -f content="$encoded"
