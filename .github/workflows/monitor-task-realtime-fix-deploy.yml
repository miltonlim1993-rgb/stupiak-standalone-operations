name: Monitor Task realtime fix production deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect-secret-names:
    runs-on: ubuntu-latest
    steps:
      - name: Persist repository secret and variable names only
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_PATH: .ops-deploy-status/github-secret-names-20260807.txt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== actions secrets ==='
            gh secret list --repo "$GITHUB_REPOSITORY" 2>&1 || true
            echo
            echo '=== actions variables ==='
            gh variable list --repo "$GITHUB_REPOSITORY" 2>&1 || true
          } > /tmp/names.txt
          encoded="$(base64 -w0 /tmp/names.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record GitHub secret names for deploy audit' -f content="$encoded"
