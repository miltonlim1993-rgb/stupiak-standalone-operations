name: Locate automatic OPS deploy workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Persist workflow run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "31146886064"
          STATUS_PATH: .ops-deploy-status/automatic-deploy-workflow-20260807.json
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '{id,name,path,event,status,conclusion,head_sha,html_url,display_title}')"
          encoded="$(printf '%s' "$result" | base64 -w0)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" --jq .sha 2>/dev/null || true)"
          if [[ -n "$current_sha" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: update automatic deploy workflow metadata' -f content="$encoded" -f sha="$current_sha"
          else
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record automatic deploy workflow metadata' -f content="$encoded"
          fi
