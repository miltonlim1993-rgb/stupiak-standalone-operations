name: Inspect live OPS shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monitor-task-realtime-fix-deploy.yml

permissions:
  contents: write

jobs:
  inspect-live-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Capture public production shell and asset refs
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
          STATUS_PATH: .ops-deploy-status/live-shell-20260807.txt
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl -sS -L -D /tmp/headers.txt "${ORIGIN}/?shell_probe=${stamp}" -o /tmp/index.html
          {
            echo '=== HEADERS ==='
            cat /tmp/headers.txt
            echo
            echo '=== ASSET REFS ==='
            grep -oE '/assets/[^"'"'"' <>()]+' /tmp/index.html | head -n 20 || true
            echo
            echo '=== BODY ==='
            head -c 5000 /tmp/index.html
          } > /tmp/report.txt
          encoded="$(base64 -w0 /tmp/report.txt)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" --jq .sha 2>/dev/null || true)"
          if [[ -n "$current_sha" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: update live OPS shell inspection' -f content="$encoded" -f sha="$current_sha"
          else
            gh api "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}" -X PUT -f message='ci: record live OPS shell inspection' -f content="$encoded"
          fi
