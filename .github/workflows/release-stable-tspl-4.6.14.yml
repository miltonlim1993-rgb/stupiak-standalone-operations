name: Release stable TSPL 4.6.14

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: release-stable-tspl-4.6.14
  cancel-in-progress: false

jobs:
  deploy-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY: miltonlim1993-rgb/stupiak-standalone-operations
      RELEASE_BRANCH: feature/task-workflow-v3-apk
      WORKER_URL: https://stupiaks-ops.sporkburger19.workers.dev
      OPS_KV_ID: f62696e1a2f14b8a9e0b84a540c7e997
      RECRUITMENT_KV_ID: ccf52a9b0bb94a4a90889f30a0e623d5
      EXPECTED_WORKER_REVISION: stable-tspl-v16-cross-device-v15-printer-v12-v4.6.14
      EXPECTED_SW_VERSION: chefops-v4-6-14-stable-tspl-v16-cross-device-v15-printer-v12
      ANDROID_WORKFLOW: android-apk.yml
      ANDROID_RELEASE_TAG: android-release-latest
      CLOUDFLARE_ACCOUNT_ID: bb2ac1970975a5018a17c878e61cb88f
      CLOUDFLARE_APP_DATA_PACKS_ID: f62696e1a2f14b8a9e0b84a540c7e997
      VITE_API_BASE_URL: https://stupiaks-ops.sporkburger19.workers.dev
      VITE_GOOGLE_LOGIN_CLIENT_ID: 460544373229-06mv64nt3e78mtse5sc375cobv13i1ii.apps.googleusercontent.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: feature/task-workflow-v3-apk
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release authorization and immutable boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "${RELEASE_BRANCH}"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured. Use the guarded local Mac release script with the existing Wrangler OAuth login.'
            exit 1
          fi
          grep -q '"version": "4.6.14"' package.json
          grep -q "${EXPECTED_WORKER_REVISION}" worker/src/entry-v3.js
          grep -q "${EXPECTED_SW_VERSION}" web/public/sw.js
          grep -q 'installStableLabelPrintV16' web/src/main.jsx
          grep -q 'tspl-stable-v16' web/src/lib/stable-tspl-label-v16.js
          grep -q 'lines.push(`PRINT ${copies},1`)' web/src/lib/stable-tspl-label-v16.js
          grep -q 'rawCommandBase64: asciiBase64(stable.command)' web/src/lib/stable-label-print-v16.js
          grep -q 'payloadBase64: asciiBase64(command)' web/src/lib/stable-label-print-v16.js
          ! grep -q 'html-raster' web/src/lib/stable-label-print-v16.js
          ! grep -q 'BITMAP' web/src/lib/stable-tspl-label-v16.js
          grep -q 'stupiaks-ops-stable-tspl-v16.apk' .github/workflows/android-apk.yml

      - name: Install dependencies
        run: npm ci

      - name: Build and validate Web, Worker and stable TSPL core
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          node --check tools/print-bridge/server.mjs
          node --check scripts/configure-android-all-device-print-v12.mjs
          bash -n scripts/deploy-web-4.6.14-stable-tspl-local.sh

      - name: Render and audit Cloudflare production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          unset CLOUDFLARE_MEDIA_BUCKET_NAME || true
          npm run cf:render
          CONFIG=worker/wrangler.production.jsonc
          grep -q '"name": "stupiaks-ops"' "$CONFIG"
          grep -q "${OPS_KV_ID}" "$CONFIG"
          if grep -q "${RECRUITMENT_KV_ID}" "$CONFIG"; then
            echo 'Recruitment KV appeared in the Ops production config. Deployment refused.'
            exit 1
          fi
          if grep -q 'MEDIA_BUCKET' "$CONFIG"; then
            echo 'R2 binding appeared in the Ops production config. Deployment refused.'
            exit 1
          fi

      - name: Deploy Web assets and Ops Worker 4.6.14
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - name: Verify production worker, shell and health
        shell: bash
        run: |
          set -Eeuo pipefail
          VERIFIED=''
          for attempt in $(seq 1 24); do
            HEADERS="$(curl -fsSI --max-time 20 "${WORKER_URL}/?acceptance=4.6.14-${GITHUB_SHA}-${attempt}" || true)"
            SHELL="$(curl -fsS --max-time 20 "${WORKER_URL}/sw.js?acceptance=4.6.14-${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$HEADERS" | grep -Fqi "x-chefops-worker-revision: ${EXPECTED_WORKER_REVISION}" \
              && printf '%s' "$SHELL" | grep -Fq "${EXPECTED_SW_VERSION}"; then
              VERIFIED=yes
              break
            fi
            sleep 5
          done
          test "$VERIFIED" = yes
          curl -fsS --max-time 20 "${WORKER_URL}/api/health" | tee production-health.json
          python3 -m json.tool production-health.json

      - name: Dispatch production-signed Android 4.6.14 build
        id: android
        shell: bash
        run: |
          set -Eeuo pipefail
          PREVIOUS_RUN_ID="$(gh run list --repo "$REPOSITORY" --workflow "$ANDROID_WORKFLOW" --branch "$RELEASE_BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run "$ANDROID_WORKFLOW" --repo "$REPOSITORY" --ref "$RELEASE_BRANCH"
          ANDROID_RUN_ID=''
          for attempt in $(seq 1 45); do
            CANDIDATE="$(gh run list --repo "$REPOSITORY" --workflow "$ANDROID_WORKFLOW" --branch "$RELEASE_BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$PREVIOUS_RUN_ID" ]; then
              ANDROID_RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          test -n "$ANDROID_RUN_ID"
          echo "run_id=$ANDROID_RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$ANDROID_RUN_ID" --repo "$REPOSITORY" --exit-status

      - name: Verify signed APK, AAB and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_NAME="$(gh release view "$ANDROID_RELEASE_TAG" --repo "$REPOSITORY" --json name --jq '.name')"
          printf '%s\n' "$RELEASE_NAME" | grep -q '4.6.14'
          ASSETS="$(gh release view "$ANDROID_RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -qx 'stupiaks-ops-release.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'stupiaks-ops-stable-tspl-v16.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'stupiaks-ops-all-device-print-v12.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'stupiaks-ops-direct-print-flow-v10.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'stupiaks-ops-release.aab'
          printf '%s\n' "$ASSETS" | grep -qx 'SHA256SUMS.txt'

      - name: Record release result on Draft PR
        if: always()
        shell: bash
        run: |
          STATUS='${{ job.status }}'
          ANDROID_RUN='${{ steps.android.outputs.run_id }}'
          cat > /tmp/release-comment.md <<EOF
          ## Stable TSPL 4.6.14 release automation

          - Result: **${STATUS}**
          - Source commit: \`${GITHUB_SHA}\`
          - Release workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Android workflow run: ${ANDROID_RUN:-not started}
          - Production URL: ${WORKER_URL}
          - PR remains Draft and unmerged.
          - No Sheet upgrade, TaskTemplate apply, Data Package publication, Ops Control publication, Recruitment KV mutation or R2 mutation was run.
          EOF
          sed -i 's/^          //' /tmp/release-comment.md
          gh pr comment 4 --repo "$REPOSITORY" --body-file /tmp/release-comment.md
