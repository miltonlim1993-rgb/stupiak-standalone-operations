name: Validate and deploy canonical OPS Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/ops/**'
      - 'scripts/deploy-realtime-ops-now.sh'
      - 'scripts/render-wrangler-production.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/ops-architecture-contract.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ github.event_name }}
  cancel-in-progress: true

env:
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bb2ac1970975a5018a17c878e61cb88f' }}
  CLOUDFLARE_APP_DATA_PACKS_ID: f62696e1a2f14b8a9e0b84a540c7e997
  CLOUDFLARE_OPS_DB_ID: 080c13d7-e2f5-4c01-a1ca-aa00094d6fc0
  CLOUDFLARE_SHEET_SYNC_QUEUE_NAME: stupiaks-ops-sheet-sync
  CLOUDFLARE_SHEET_SYNC_DLQ_NAME: stupiaks-ops-sheet-sync-dlq
  VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}

jobs:
  validate-and-optional-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Audit canonical OPS architecture contract
        run: npm run ops:audit:contract
      - name: Build Web and Worker dry-run
        run: npm run build
      - name: Render canonical production bindings
        run: npm run cf:render
      - name: Validate rendered resources
        run: |
          grep -Fq '"main": "src/entry.js"' worker/wrangler.production.jsonc
          grep -Fq '"database_name": "stupiaks-ops-realtime"' worker/wrangler.production.jsonc
          grep -Fq '"database_id": "080c13d7-e2f5-4c01-a1ca-aa00094d6fc0"' worker/wrangler.production.jsonc
          grep -Fq '"queue": "stupiaks-ops-sheet-sync"' worker/wrangler.production.jsonc
      - name: Record push validation result
        if: github.event_name == 'push'
        run: |
          echo "PUSH_VALIDATION_COMPLETE=true"
          echo "PRODUCTION_DEPLOYMENT_RUN=false"
          echo "A normal main push does not deploy production. Use an explicit workflow dispatch or the trusted local Wrangler command."
      - name: Require Cloudflare credentials for explicit deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Manual deployment requested, but GitHub Actions cannot read CLOUDFLARE_API_TOKEN." >&2
            echo "Do not recreate a token automatically. Use the trusted local Wrangler deployment or configure the repository Actions secret." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and Web/PWA assets without migrations
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "D1_MIGRATION_RUN=false"
          echo "D1_BACKFILL_RUN=false"
          echo "D1_RESOURCE_CREATION_RUN=false"
          npx wrangler deploy --config worker/wrangler.production.jsonc
      - name: Verify canonical production Worker, PWA and fixed signed APK
        if: github.event_name == 'workflow_dispatch'
        env:
          OPS_VERIFY_OUTPUT_DIR: ${{ runner.temp }}/ops-production-verification
          OPS_APK_OUTPUT: ${{ runner.temp }}/Stupiaks-Ops-latest.apk
        run: npm run ops:verify:production
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: ops-production-verification
          path: ${{ runner.temp }}/ops-production-verification/
          if-no-files-found: warn
