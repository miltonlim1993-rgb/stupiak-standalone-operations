name: Emergency deploy OPS web maintenance gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production-emergency-maintenance
  cancel-in-progress: true

env:
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'bb2ac1970975a5018a17c878e61cb88f' }}
  CLOUDFLARE_APP_DATA_PACKS_ID: f62696e1a2f14b8a9e0b84a540c7e997
  CLOUDFLARE_OPS_DB_ID: 080c13d7-e2f5-4c01-a1ca-aa00094d6fc0
  CLOUDFLARE_SHEET_SYNC_QUEUE_NAME: stupiaks-ops-sheet-sync
  CLOUDFLARE_SHEET_SYNC_DLQ_NAME: stupiaks-ops-sheet-sync-dlq
  VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}

jobs:
  deploy-maintenance-gate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: checkout
        name: Checkout isolated maintenance branch
        uses: actions/checkout@v4
        with:
          ref: emergency/web-maintenance-2026-08-21

      - id: setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: credential
        name: Require existing Cloudflare deployment credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN is unavailable; refusing to guess or recreate credentials." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - id: install
        name: Install exact dependencies
        run: npm ci

      - id: build
        name: Validate maintenance source and normal build
        run: |
          node --check worker/src/entry-web-maintenance.js
          npm run build

      - id: render
        name: Render canonical production bindings
        run: npm run cf:render

      - id: config
        name: Switch deployed entry to maintenance and force Worker-first assets
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'worker/wrangler.production.jsonc'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          config.main = 'src/entry-web-maintenance.js'
          config.assets = config.assets || {}
          config.assets.run_worker_first = true
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n')
          NODE
          grep -Fq '"main": "src/entry-web-maintenance.js"' worker/wrangler.production.jsonc
          grep -Fq '"run_worker_first": true' worker/wrangler.production.jsonc
          grep -Fq '"database_name": "stupiaks-ops-realtime"' worker/wrangler.production.jsonc
          grep -Fq '"database_id": "080c13d7-e2f5-4c01-a1ca-aa00094d6fc0"' worker/wrangler.production.jsonc
          grep -Fq '"queue": "stupiaks-ops-sheet-sync"' worker/wrangler.production.jsonc
          grep -Fq '"bucket_name": "stupiaks-ops-media"' worker/wrangler.production.jsonc
          echo "D1_MIGRATION_RUN=false"
          echo "D1_BACKFILL_RUN=false"
          echo "D1_RESOURCE_CREATION_RUN=false"
          echo "PRODUCTION_BUSINESS_DATA_MUTATION=false"

      - id: deploy
        name: Deploy maintenance gate only
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - id: verify
        name: Verify web is paused and health remains available
        run: |
          root_code="$(curl -sS -o /tmp/root.html -w '%{http_code}' "$OPS_PRODUCTION_ORIGIN/")"
          test "$root_code" = "503"
          grep -Fq 'Stupiak OPS web access is paused' /tmp/root.html

          api_code="$(curl -sS -o /tmp/api.json -w '%{http_code}' "$OPS_PRODUCTION_ORIGIN/api/auth/me")"
          test "$api_code" = "503"
          grep -Fq 'web_maintenance' /tmp/api.json

          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$OPS_PRODUCTION_ORIGIN/api/health")"
          test "$health_code" = "200"
          curl -sSI "$OPS_PRODUCTION_ORIGIN/api/health" | grep -Fiq 'x-chefops-maintenance: web-maintenance-2026-08-21-v1'

          echo "WEB_MAINTENANCE_ACTIVE=true"
          echo "PRODUCTION_URL_CHANGED=false"
          echo "PRODUCTION_DATABASE_CHANGED=false"

      - name: Record maintenance deployment result
        if: always()
        run: |
          TITLE="[OPS] WEB_MAINTENANCE_DIAGNOSTIC 2026-08-21 run-${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Emergency maintenance workflow diagnostic.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          checkout=${{ steps.checkout.outcome }}
          setup=${{ steps.setup.outcome }}
          credential=${{ steps.credential.outcome }}
          install=${{ steps.install.outcome }}
          build=${{ steps.build.outcome }}
          render=${{ steps.render.outcome }}
          config=${{ steps.config.outcome }}
          deploy=${{ steps.deploy.outcome }}
          verify=${{ steps.verify.outcome }}

          WEB_MAINTENANCE_ACTIVE=${{ steps.verify.outcome == 'success' }}
          D1_MIGRATION_RUN=false
          D1_BACKFILL_RUN=false
          PRODUCTION_BUSINESS_DATA_MUTATION=false
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
