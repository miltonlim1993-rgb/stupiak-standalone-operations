name: Validate and deploy canonical OPS Worker

on:
  workflow_dispatch:
    inputs:
      expected_health_marker:
        description: Optional marker that must appear in /api/health after deployment
        required: false
        default: stale-aware-v1
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'worker/**'
      - 'scripts/render-wrangler-production.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

env:
  OPS_PRODUCTION_ORIGIN: https://stupiaks-ops.sporkburger19.workers.dev

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_APP_DATA_PACKS_ID: ${{ secrets.CLOUDFLARE_APP_DATA_PACKS_ID }}
      CLOUDFLARE_MEDIA_BUCKET_NAME: ${{ secrets.CLOUDFLARE_MEDIA_BUCKET_NAME }}
      VITE_GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.VITE_GOOGLE_LOGIN_CLIENT_ID }}
      EXPECTED_HEALTH_MARKER: ${{ inputs.expected_health_marker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web and Worker
        run: npm run build

      - name: Render production Wrangler config
        run: npm run cf:render

      - name: Detect GitHub deployment credentials
        id: auth
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Actions Cloudflare deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: this GitHub Actions context cannot read CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
            echo "Cloudflare Dashboard Pages/Worker runtime variables do not authenticate GitHub Actions."
            echo "The canonical production origin remains $OPS_PRODUCTION_ORIGIN."
          fi

      - name: Stop a manual deployment when credentials are unavailable
        if: github.event_name == 'workflow_dispatch' && steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          echo "Manual deployment requested, but GitHub deployment credentials are unavailable."
          echo "Use a Wrangler-authenticated local machine (npm run cf:deploy) or add the repository Actions secret CLOUDFLARE_API_TOKEN."
          exit 1

      - name: Deploy Worker and web assets
        if: steps.auth.outputs.available == 'true'
        run: npx wrangler deploy --config worker/wrangler.production.jsonc

      - name: Verify canonical production Worker
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          health_url="$OPS_PRODUCTION_ORIGIN/api/health"
          response=''

          for attempt in $(seq 1 30); do
            response=$(curl -fsS --max-time 20 "$health_url" || true)
            if [[ -n "$response" ]] && HEALTH_RESPONSE="$response" node - <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_RESPONSE || '{}')
          if (payload?.ok !== true || payload?.service !== 'chefops-api') process.exit(1)
          NODE
            then
              if [[ -z "${EXPECTED_HEALTH_MARKER:-}" ]] || grep -q "$EXPECTED_HEALTH_MARKER" <<<"$response"; then
                printf '%s\n' "$response"
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Canonical production verification failed: $health_url"
          echo "Last response: $response"
          exit 1
