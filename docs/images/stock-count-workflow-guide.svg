<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="760" viewBox="0 0 2200 760">
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".07"/></filter></defs>
<rect width="2200" height="760" fill="#F4F7FB"/>
<text x="60" y="72" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#111827">Stock Count / Standard Workflow</text>
<text x="60" y="112" font-family="Arial,sans-serif" font-size="21" fill="#64748B">Save only after every list item has an actual quantity</text>
<g font-family="Arial,sans-serif">
<!-- card 1 --><rect x="60" y="170" width="480" height="450" rx="28" fill="#fff" stroke="#D7DEE8" stroke-width="2" filter="url(#s)"/><circle cx="118" cy="235" r="30" fill="#F5B400"/><text x="118" y="246" text-anchor="middle" font-size="30" font-weight="850">1</text><text x="168" y="235" font-size="27" font-weight="800" fill="#111827">Select date and outlet</text><rect x="100" y="315" width="400" height="80" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><path d="M135 343 h28 v27 h-28z M140 335 v16 M158 335 v16 M135 350 h28" fill="none" stroke="#111827" stroke-width="4"/><text x="185" y="365" font-size="22" font-weight="650" fill="#334155">Confirm before counting</text><text x="100" y="470" font-size="20" fill="#334155">Choose the count date and verify</text><text x="100" y="501" font-size="20" fill="#334155">the correct outlet.</text>
<!-- arrow --><path d="M555 395 h28 l-10-10 m10 10 l-10 10" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- card 2 --><rect x="600" y="170" width="480" height="450" rx="28" fill="#fff" stroke="#D7DEE8" stroke-width="2" filter="url(#s)"/><circle cx="658" cy="235" r="30" fill="#F5B400"/><text x="658" y="246" text-anchor="middle" font-size="30" font-weight="850">2</text><text x="708" y="235" font-size="27" font-weight="800" fill="#111827">Count every item</text><rect x="640" y="315" width="400" height="80" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="675" y="365" font-size="22" fill="#64748B">Previous</text><rect x="820" y="333" width="175" height="45" rx="10" fill="#fff" stroke="#F5B400" stroke-width="3"/><text x="850" y="363" font-size="20" font-weight="700">Actual</text><text x="640" y="470" font-size="20" fill="#334155">Use Previous as reference and enter</text><text x="640" y="501" font-size="20" fill="#334155">the physical quantity in Actual.</text>
<path d="M1095 395 h28 l-10-10 m10 10 l-10 10" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- card 3 --><rect x="1140" y="170" width="480" height="450" rx="28" fill="#fff" stroke="#D7DEE8" stroke-width="2" filter="url(#s)"/><circle cx="1198" cy="235" r="30" fill="#F5B400"/><text x="1198" y="246" text-anchor="middle" font-size="30" font-weight="850">3</text><text x="1248" y="235" font-size="27" font-weight="800" fill="#111827">Review completion</text><rect x="1180" y="315" width="230" height="80" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="1210" y="365" font-size="22" font-weight="750">Remaining 0</text><rect x="1430" y="315" width="150" height="80" rx="18" fill="#FEE2E2" stroke="#FCA5A5"/><text x="1505" y="365" text-anchor="middle" font-size="22" font-weight="750" fill="#B91C1C">Low</text><text x="1180" y="470" font-size="20" fill="#334155">Remaining must reach 0. Review Low</text><text x="1180" y="501" font-size="20" fill="#334155">items for verification or replenishment.</text>
<path d="M1635 395 h28 l-10-10 m10 10 l-10 10" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- card 4 --><rect x="1680" y="170" width="460" height="450" rx="28" fill="#fff" stroke="#D7DEE8" stroke-width="2" filter="url(#s)"/><circle cx="1738" cy="235" r="30" fill="#F5B400"/><text x="1738" y="246" text-anchor="middle" font-size="30" font-weight="850">4</text><text x="1788" y="235" font-size="27" font-weight="800" fill="#111827">Save and confirm</text><rect x="1765" y="315" width="290" height="80" rx="18" fill="#F5B400" stroke="#D99F00"/><path d="M1810 337 h28 v30 h-28z M1816 337 v10 h16 v-10 M1816 357 h16" fill="none" stroke="#111827" stroke-width="4"/><text x="1860" y="365" font-size="23" font-weight="800">Save</text><text x="1720" y="470" font-size="20" fill="#334155">Press Save, wait for the success message,</text><text x="1720" y="501" font-size="20" fill="#334155">then confirm the saved count remains.</text>
</g>
<rect x="60" y="655" width="2080" height="54" rx="18" fill="#111827"/><text x="1100" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="650" fill="#fff">If an item is missing, the page clears filters and jumps to the first incomplete field.</text>
</svg>